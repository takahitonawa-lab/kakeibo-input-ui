<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>名和家の家計簿</title>
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kosugi Maru', sans-serif;
            background-color: #fff0f5; /* 淡いピンクの背景 */
            color: #333;
            margin: 0;
            padding: 10px;
            padding-bottom: 70px; /* タブバーのスペース確保 */
        }
        h2 {
            text-align: center;
            color: #d87093;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .header-icon {
            width: 40px;
            height: auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #c71585;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ffb6c1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            font-family: 'Kosugi Maru', sans-serif;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #ff69b4;
            box-shadow: 0 0 5px rgba(255,105,180,0.5);
        }
        .btn {
            background-color: #ff69b4;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 25px;
            width: 100%;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
            font-family: 'Kosugi Maru', sans-serif;
        }
        .btn:hover {
            background-color: #ff1493;
        }
        .category-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 10px;
        }
        .cat-btn {
            background-color: white;
            border: 1px solid #ffb6c1;
            color: #c71585;
            padding: 8px 12px;
            border-radius: 15px;
            font-size: 14px;
            cursor: pointer;
            font-family: 'Kosugi Maru', sans-serif;
            flex: 1 1 calc(25% - 5px); /* 4列に調整 */
            text-align: center;
        }
        .cat-btn.selected {
            background-color: #ffb6c1;
            color: white;
            font-weight: bold;
        }
        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            color: #32cd32;
        }
        /* スピナー（ローディング）のスタイル */
        .spinner {
            display: none;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 105, 180, 0.3);
            border-radius: 50%;
            border-top-color: #ff69b4;
            animation: spin 1s ease-in-out infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* 下部固定タブバーのスタイル */
        .bottom-tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #ffffff;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.05);
        }
        .tab-item {
            flex: 1;
            text-align: center;
            color: #888;
            font-size: 12px;
            cursor: pointer;
            padding: 10px 0;
            transition: 0.2s;
        }
        .tab-item.active {
            color: #ff69b4; /* クロミちゃんカラーに合わせたピンク */
            font-weight: bold;
        }
        .tab-icon {
            font-size: 24px;
            display: block;
            margin-bottom: 2px;
        }
        /* 画面切り替え用のコンテナ */
        #view-input {
            display: block; /* 初期表示 */
        }
        #view-dashboard {
            display: none;
            width: 100%;
            height: calc(100vh - 60px);
            margin: -10px; /* bodyのpaddingを相殺 */
        }
        #view-dashboard iframe {
            width: 100vw;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<div id="view-input">
    <h2>
        <img src="kuromi_icon.png" alt="クロミ" class="header-icon" onerror="this.style.display='none'"> 
        名和家の家計簿！
    </h2>

    <form id="kakeiboForm">
        <div class="form-group">
            <label for="date">📅 日付</label>
            <input type="date" id="date" name="date" required>
        </div>

        <div class="form-group">
            <label>🏷️ カテゴリ (タップで選択)</label>
            <div class="category-buttons" id="categoryButtons">
                </div>
            <input type="hidden" id="category" name="category" required>
        </div>

        <div class="form-group">
            <label for="amount">💰 金額 (円)</label>
            <input type="number" id="amount" name="amount" placeholder="例: 1500" required>
        </div>

        <div class="form-group">
            <label for="method">💳 支払方法</label>
            <select id="method" name="method" required>
                </select>
        </div>

        <div class="form-group">
            <label for="memo">📝 メモ (任意)</label>
            <input type="text" id="memo" name="memo" placeholder="買ったもの等">
        </div>

        <button type="submit" class="btn" id="submitBtn">登録する！ 🎀</button>
        <div class="spinner" id="loadingSpinner"></div>
    </form>

    <div id="message"></div>
</div>

<div id="view-dashboard">
    <iframe src="https://script.google.com/macros/s/AKfycbxB4i2wRjP1wV3yI4E7y71b562W-4R_7A/exec"></iframe>
</div>

<div class="bottom-tab-bar">
    <div class="tab-item active" id="tab-input" onclick="switchTab('input')">
        <span class="tab-icon">✏️</span>
        入力
    </div>
    <div class="tab-item" id="tab-dashboard" onclick="switchTab('dashboard')">
        <span class="tab-icon">📊</span>
        分析
    </div>
</div>

<script>
    // -------------------------
    // 設定
    // -------------------------
    // ★ GASのウェブアプリURL (入力データ送信用アクションパラメータ付き)
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxB4i2wRjP1wV3yI4E7y71b562W-4R_7A/exec?action=master'; 

    // 初期化
    document.getElementById('date').valueAsDate = new Date();
    
    // -------------------------
    // タブ切り替え機能
    // -------------------------
    function switchTab(tabName) {
        if (tabName === 'input') {
            document.getElementById('view-input').style.display = 'block';
            document.getElementById('view-dashboard').style.display = 'none';
            document.getElementById('tab-input').classList.add('active');
            document.getElementById('tab-dashboard').classList.remove('active');
        } else {
            document.getElementById('view-input').style.display = 'none';
            document.getElementById('view-dashboard').style.display = 'block';
            document.getElementById('tab-input').classList.remove('active');
            document.getElementById('tab-dashboard').classList.add('active');
        }
    }

    // -------------------------
    // マスターデータの取得 (JSONP方式)
    // -------------------------
    function fetchMasterData() {
        const script = document.createElement('script');
        script.src = GAS_URL + '&callback=initMasterData';
        document.body.appendChild(script);
    }

    function initMasterData(data) {
        console.log("Master Data loaded:", data);
        
        // カテゴリボタンの生成
        const catContainer = document.getElementById('categoryButtons');
        catContainer.innerHTML = ''; // クリア
        const categories = data.categories || ["食費", "外食", "日用品", "交通費", "交際費", "趣味", "特別費"]; // デフォルト
        
        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'cat-btn';
            btn.textContent = cat;
            btn.onclick = function() {
                // 選択状態のリセット
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
                // 選択状態にする
                this.classList.add('selected');
                document.getElementById('category').value = cat;
            };
            catContainer.appendChild(btn);
        });

        // 支払方法の生成
        const methodSelect = document.getElementById('method');
        methodSelect.innerHTML = ''; // クリア
        const methods = data.methods || ["PayPay後払い", "クレジットカード", "現金"]; // デフォルト
        
        methods.forEach(method => {
            const option = document.createElement('option');
            option.value = method;
            option.textContent = method;
            methodSelect.appendChild(option);
        });
    }

    // ページ読み込み時にマスター取得
    window.onload = fetchMasterData;

    // -------------------------
    // データ送信処理
    // -------------------------
    document.getElementById('kakeiboForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // カテゴリが選択されているかチェック
        if(!document.getElementById('category').value) {
            alert('カテゴリを選択してください！');
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        const spinner = document.getElementById('loadingSpinner');
        const msgDiv = document.getElementById('message');

        // UI状態変更
        submitBtn.style.display = 'none';
        spinner.style.display = 'block';
        msgDiv.textContent = '';

        // 送信データ作成
        const formData = new URLSearchParams(new FormData(this));

        // 送信
        fetch('https://script.google.com/macros/s/AKfycbxB4i2wRjP1wV3yI4E7y71b562W-4R_7A/exec', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            spinner.style.display = 'none';
            submitBtn.style.display = 'block';
            
            if(data.ok) {
                msgDiv.style.color = '#32cd32';
                msgDiv.textContent = '✨ 登録完了！お疲れ様でした ✨';
                // フォームリセット (日付と支払方法は保持)
                document.getElementById('amount').value = '';
                document.getElementById('memo').value = '';
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
                document.getElementById('category').value = '';
                // iframe(ダッシュボード)を再読み込みして最新データを反映させる
                const iframe = document.querySelector('#view-dashboard iframe');
                if(iframe) iframe.src = iframe.src;
            } else {
                msgDiv.style.color = 'red';
                msgDiv.textContent = 'エラーが発生しました💦';
            }
        })
        .catch(error => {
            console.error('Error:', error);
            spinner.style.display = 'none';
            submitBtn.style.display = 'block';
            msgDiv.style.color = 'red';
            msgDiv.textContent = '通信エラーです💦';
        });
    });
</script>

</body>
</html>
