<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>名和家の家計簿！</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <style>
    :root{
      --ink: #444; --muted: #888;
      --bg-pink: #fff0f5; --bg-purple: #f3f0ff; --accent-pink: #ff7eb3;
      --card-bg: rgba(255, 255, 255, 0.85); --border-thick: 2.5px;
      --stamp-size: 86px;
    }
    html,body{
      margin:0; padding:0; background: linear-gradient(135deg, var(--bg-pink) 0%, var(--bg-purple) 100%);
      background-attachment: fixed; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100%; overflow: hidden; color: var(--ink);
    }
    *{ box-sizing: border-box; touch-action: manipulation; }

    /* 変更点: タブバーに被らないよう padding-bottom を 80px に増やしました */
    .page { max-width: 500px; margin: 0 auto; padding: 10px 10px 80px 10px; height: 100svh; overflow-y: auto; overflow-x: hidden; position: relative; z-index: 1; }

    .header { position: relative; margin-bottom: 8px; min-height: 105px; padding: 10px 5px 0; }
    .title-group { position: relative; z-index: 2; padding-right: 100px; }
    .title-main { font-size: 24px; font-weight: 900; margin: 0; color: #555; }
    .title-sub { font-size: 12px; color: var(--muted); margin: 6px 0 0 0; font-weight: 600; line-height: 1.4; }
    .top-icon { position: absolute; right: 5px; top: 0px; width: 110px; height: 110px; object-fit: contain; opacity: 0.35; z-index: 0; pointer-events: none; }

    .budget-card {
      position: relative; z-index: 2; background: #fff; border-radius: 20px; padding: 16px;
      margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: var(--border-thick) solid #fff;
    }
    .budget-info { display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; color: var(--accent-pink); }
    .budget-bar-bg { height: 12px; background: #f5f5f5; border-radius: 6px; overflow: hidden; margin-top: 8px; }
    .budget-bar-fill { height: 100%; background: linear-gradient(90deg, #34d399, #10b981); width: 0%; transition: width 1s ease; }
    .budget-sub { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; font-weight: bold; color: var(--muted); }
    .budget-sub b { color: #10b981; font-size: 14px; }
    .budget-sub.over b { color: var(--accent-pink); }

    .card { background: var(--card-bg); border-radius: 24px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); border: var(--border-thick) solid #fff; backdrop-filter: blur(5px); }
    label { font-size: 10.5px; color: var(--muted); display: block; margin-bottom: 4px; font-weight: bold; padding-left: 4px; white-space: nowrap; }

    .amount-wrapper { position: relative; display: flex; align-items: center; margin-bottom: 12px; }
    .currency { position: absolute; left: 15px; font-weight: 900; font-size: 24px; color: var(--accent-pink); }
    input[name="amount"] { padding-left: 45px !important; font-size: 28px !important; font-weight: 900; color: var(--accent-pink); border: 2px solid #ffe0ec !important; background: #fff !important; border-radius: 16px; }

    input, select { width: 100%; border: 1.5px solid #eee; border-radius: 14px; padding: 0 12px; height: 46px; font-size: 15px; outline: none; margin-bottom: 12px; background: #fff; }

    /* 分類ボタン群（2行） */
    .cat-grid { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .cat-row { display: flex; gap: 6px; }
    .cat-chip { flex: 1 1 auto; min-width: 0; margin: 0; padding: 0; font-size: inherit; cursor: pointer; }
    .cat-chip input { position: absolute; opacity: 0; width: 0; height: 0; margin: 0; padding: 0; pointer-events: none; }
    .cat-chip span { display: block; text-align: center; white-space: nowrap; padding: 9px 6px; border-radius: 999px; background: #fff; border: 1.5px solid #eee; font-size: 12.5px; font-weight: bold; color: #666; transition: .15s; }
    .cat-chip input:checked + span { background: var(--accent-pink); border-color: var(--accent-pink); color: #fff; }
    @media (max-width: 360px) {
      .cat-row { gap: 4px; }
      .cat-chip span { padding: 9px 3px; font-size: 12px; }
    }
    .cat-sub { margin: 4px 0 -2px 4px; font-size: 10px; font-weight: bold; color: #b8a8b8; }
    .cat-row.special .cat-chip span { padding: 8px 4px; font-size: 12px; background: #faf7ff; border-style: dashed; }
    .cat-row.special .cat-chip input:checked + span { background: var(--accent-pink); border-color: var(--accent-pink); border-style: solid; color: #fff; }
    .cat-chip.flash span { animation: flash .6s ease; }
    /* 分類を選び直してほしいとき（同じお店でもう1件・いくつかの分類で使うお店） */
    .cat-grid.pick .cat-chip span { animation: pick 1.2s ease 2; }
    @keyframes pick { 0%,100%{ border-color: #eee; } 50%{ border-color: var(--accent-pink); box-shadow: 0 0 0 3px #ffe0ec; } }

    /* 選んだ分類の残り予算と説明（説明は Category_Master のメモ欄） */
    .cat-info { margin: -6px 0 14px; padding: 9px 12px; border-radius: 14px; background: #fff; border: 1.5px solid #ffe0ec; }
    .cat-info[hidden] { display: none; }
    .cat-remain { font-size: 13px; font-weight: 900; color: #10b981; }
    .cat-remain.over { color: var(--accent-pink); }
    .cat-remain small { font-size: 10.5px; font-weight: bold; color: var(--muted); margin-left: 4px; }
    .cat-remain .hint { display: block; margin-top: 2px; font-size: 11px; color: var(--accent-pink); }
    .cat-note { margin-top: 3px; font-size: 11px; line-height: 1.45; color: var(--muted); font-weight: bold; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .cat-note:empty { display: none; }

    /* 同じお店でもう1件 */
    .again-btn { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 0 6px; width: 100%; margin: 0 0 12px; padding: 9px 12px; border-radius: 14px; border: 1.5px dashed #ffc6dc; background: #fff0f5; color: var(--accent-pink); font-size: 14px; font-weight: 900; cursor: pointer; }
    .again-btn[hidden] { display: none; }
    .again-btn small { font-size: 10.5px; color: var(--muted); font-weight: bold; }
    .again-btn:active { background: #ffe0ec; }
    @keyframes flash { 0%{ transform: scale(1); } 40%{ transform: scale(1.12); } 100%{ transform: scale(1); } }

    /* 自由記入欄の予測候補 */
    .memo-wrap { position: relative; }
    .ac-list { display: none; position: absolute; left: 0; right: 0; top: 50px; z-index: 20; background: #fff; border: 1.5px solid #ffe0ec; border-radius: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); overflow: hidden; }
    .ac-list.show { display: block; }
    .ac-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 14px; font-size: 14px; font-weight: bold; color: #555; cursor: pointer; }
    .ac-item + .ac-item { border-top: 1px solid #fff0f5; }
    .ac-item:active { background: #fff0f5; }
    .ac-item small { flex: 0 0 auto; font-size: 11px; color: var(--muted); }

    .row-flex { display: flex; gap: 12px; align-items: flex-end; margin-top: 2px; }
    .date-box { flex: 1; min-width: 0; }
    .date-quick { display: flex; gap: 8px; margin-bottom: 8px; }
    .date-quick button { flex: 1; min-width: 0; height: 38px; border-radius: 12px; border: 1.5px solid #eee; background: #fff; color: #777; font-size: 13px; font-weight: bold; cursor: pointer; }
    .date-quick button.on { background: #ffe0ec; border-color: #ffc6dc; color: var(--accent-pink); }
    /* iOS の日付欄は width を無視するので見た目をリセットして横幅を揃える */
    input[type="date"].date-input { -webkit-appearance: none; appearance: none; display: block; width: 100%; min-width: 0; height: 38px; margin: 0; border-radius: 12px; border-color: #eee; font-size: 14px; text-align: left; background: #fff; color: var(--ink); }
    input[type="date"].date-input::-webkit-date-and-time-value { text-align: left; }

    .btn-group { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; }
    .stamp-btn {
      width: var(--stamp-size); height: var(--stamp-size); border-radius: 22px;
      border: 3px solid #fff; background: linear-gradient(135deg, #ffbdc0, #fecfef);
      box-shadow: 0 5px 0px rgba(255, 126, 179, 0.2); cursor: pointer; position: relative;
      display: flex; align-items: center; justify-content: center; transition: all 0.1s; padding: 0; overflow: hidden;
    }
    .btn-inner-label { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 100%; text-align: center; font-size: 10px; font-weight: 900; color: #fff; opacity: 0.65; z-index: 2; pointer-events: none; text-shadow: 0 0 4px rgba(0,0,0,0.2); }
    .stamp-btn img { width: 90%; height: 90%; object-fit: contain; position: relative; z-index: 1; margin-top: 4px; }
    .stamp-btn:active { transform: translateY(3px); box-shadow: 0 2px 0px rgba(255, 126, 179, 0.2); }

    .history-item { background: rgba(255, 255, 255, 0.7); border-radius: 18px; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border: 1.5px solid #fff; }
    .history-item.pending { border-style: dashed; border-color: #ffc6dc; }
    .history-item.tappable { cursor: pointer; transition: background .15s; }
    .history-item.tappable:active { background: #fff; }
    .section-title { font-size: 13px; font-weight: bold; color: var(--muted); margin-bottom: 10px; padding-left: 10px; }
    .section-title small { font-size: 10.5px; font-weight: bold; color: #b8a8b8; margin-left: 4px; }
    .h-memo { font-weight: bold; font-size: 14px; }
    .h-sub { font-size: 10px; color: var(--muted); }
    .h-state { font-size: 10px; font-weight: bold; color: var(--accent-pink); }
    .del-btn { color: #fff; border: none; background: #ffb5d2; border-radius: 10px; width: 32px; height: 32px; font-weight: bold; cursor: pointer; }

    /* 未送信・通信状態 */
    .sync-bar { display: none; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 12px; padding: 10px 14px; border-radius: 16px; background: #fff; border: 1.5px dashed #ffc6dc; font-size: 12px; font-weight: bold; color: #777; }
    .sync-bar.show { display: flex; }
    /* 先月の結果（月初めに1回出す） */
    .result-card { display: none; position: relative; margin: 0 0 12px; padding: 14px 40px 14px 16px; border-radius: 20px; background: #fff; border: var(--border-thick) solid #ffe0ec; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
    .result-card.show { display: block; }
    .result-title { font-size: 16px; font-weight: 900; color: #10b981; }
    .result-card.over .result-title { color: var(--accent-pink); }
    .result-sub { margin-top: 4px; font-size: 12px; font-weight: bold; color: var(--muted); line-height: 1.5; }
    .result-sub b { color: var(--ink); }
    .result-close { position: absolute; right: 8px; top: 8px; border: none; background: #fff0f5; width: 28px; height: 28px; border-radius: 10px; font-size: 13px; font-weight: bold; color: #c9a9bb; cursor: pointer; }
    .sync-bar button { flex: 0 0 auto; border: none; background: var(--accent-pink); color: #fff; border-radius: 10px; padding: 6px 12px; font-size: 12px; font-weight: bold; cursor: pointer; }
    .empty-msg { text-align: center; font-size: 12px; color: var(--muted); padding: 16px 0; }
    .more-btn { display: block; width: 100%; height: 42px; margin-top: 4px; border-radius: 16px; border: 1.5px solid #fff; background: rgba(255, 255, 255, 0.7); color: var(--accent-pink); font-size: 13px; font-weight: bold; cursor: pointer; }
    .more-btn[hidden] { display: none; }

    /* 記録の修正パネル（下から出るシート） */
    .sheet-backdrop { position: fixed; inset: 0; background: rgba(70, 50, 70, 0.35); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 1100; }
    .sheet-backdrop.show { opacity: 1; pointer-events: auto; }
    .sheet { position: fixed; left: 50%; bottom: 0; width: 100%; max-width: 500px; max-height: 92svh; overflow-y: auto; transform: translate(-50%, 105%); transition: transform .3s ease; z-index: 1101; visibility: hidden;
      background: linear-gradient(135deg, var(--bg-pink) 0%, var(--bg-purple) 100%); border-radius: 26px 26px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 30px rgba(0,0,0,0.08); }
    .sheet.show { transform: translate(-50%, 0); visibility: visible; }
    .sheet-grip { width: 42px; height: 5px; border-radius: 3px; background: #e8d6e2; margin: 0 auto 10px; }
    .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .sheet-title { font-size: 17px; font-weight: 900; color: #555; }
    .sheet-close { border: none; background: #fff; width: 34px; height: 34px; border-radius: 12px; font-size: 16px; font-weight: bold; color: #aaa; cursor: pointer; }
    .sheet .card { padding: 16px; }
    .sheet-actions { display: flex; gap: 10px; margin-top: 14px; }
    .sheet-del { flex: 0 0 auto; height: 48px; padding: 0 18px; border-radius: 16px; border: 1.5px solid #ffc6dc; background: #fff; color: var(--accent-pink); font-size: 14px; font-weight: bold; cursor: pointer; }
    .sheet-save { flex: 1; height: 48px; border-radius: 16px; border: none; background: linear-gradient(135deg, #ff9ac4, var(--accent-pink)); color: #fff; font-size: 15px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 0 rgba(255, 126, 179, 0.25); }
    .sheet-save:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(255, 126, 179, 0.25); }
    .sheet-save:disabled, .sheet-del:disabled { opacity: .6; }

    .toastWrap { position: fixed; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; z-index: 1200; }
    .toast { background: #fff; border-radius: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); padding: 20px; display: flex; gap: 15px; align-items: center; opacity: 0; transform: translateY(20px); transition: .4s; border: 3px solid #ffdeeb; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast img { width: 70px; height: 70px; object-fit: contain; }

    /* ログイン画面。ログインを確かめるまでは、入力画面も分析も出さない */
    #view-login { display: none; height: 100svh; overflow-y: auto; padding: 20px; }
    body.signed-out #view-login { display: flex; align-items: center; justify-content: center; }
    body.signed-out #view-input, body.signed-out #view-dashboard, body.signed-out .bottom-tab-bar,
    body.booting #view-input, body.booting #view-dashboard, body.booting .bottom-tab-bar { display: none !important; }
    .login-box { width: 100%; max-width: 360px; text-align: center; background: var(--card-bg); border: var(--border-thick) solid #fff; border-radius: 28px; padding: 30px 22px 26px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); }
    .login-icon { width: 120px; height: 120px; object-fit: contain; opacity: .8; }
    .login-lead { font-size: 13px; font-weight: bold; color: var(--muted); margin: 10px 0 18px; }
    .login-msg { display: none; font-size: 12px; font-weight: bold; color: var(--accent-pink); background: #fff; border: 1.5px dashed #ffc6dc; border-radius: 14px; padding: 10px 12px; margin: 0 0 16px; line-height: 1.5; }
    .login-msg.show { display: block; }
    .login-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 54px; border-radius: 18px; border: 2px solid #ffe0ec; background: #fff; color: #555; font-size: 16px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 0 rgba(255, 126, 179, 0.15); }
    .login-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(255, 126, 179, 0.15); }
    .login-btn:disabled { opacity: .6; }
    .login-btn svg { width: 22px; height: 22px; flex: 0 0 auto; }
    .account-line { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 26px; font-size: 11px; color: #b8a8b8; }
    .account-line button { border: none; background: none; padding: 4px; color: #b8a8b8; font-size: 11px; font-weight: bold; text-decoration: underline; cursor: pointer; }

    /* ▼ 追加：タブ切り替えとダッシュボード用のCSS ▼ */
    .bottom-tab-bar {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 65px;
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
      border-top: var(--border-thick) solid #fff;
      display: flex; justify-content: center; align-items: center;
      z-index: 1000; padding-bottom: env(safe-area-inset-bottom);
    }
    .tab-container { width: 100%; max-width: 500px; display: flex; justify-content: space-around; }
    .tab-item { flex: 1; text-align: center; color: var(--muted); font-size: 11px; font-weight: bold; padding: 8px 0; cursor: pointer; transition: 0.2s; }
    .tab-item.active { color: var(--accent-pink); }
    .tab-icon { font-size: 22px; display: block; margin-bottom: 4px; }

    #view-input { display: block; height: 100%; }
    /* 分析は裏でデータだけ先に読み込み、タブを開いたときに描く */
    #view-dashboard { display: none; position: relative; height: 100%; }
    #view-dashboard.show { display: block; }
    .dash-loading { padding: 40% 0 0; text-align: center; font-size: 13px; font-weight: bold; color: var(--muted); }
    .dash-updating { display: none; position: absolute; right: 12px; top: 8px; z-index: 5; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,0.92); box-shadow: 0 2px 8px rgba(0,0,0,0.08); font-size: 11px; font-weight: bold; color: var(--accent-pink); pointer-events: none; }

    /* 分析画面（以前の GAS の分析画面と同じ見た目） */
    .dash-page { height: 100svh; overflow-y: auto; overflow-x: hidden; background: #f4f7f6; font-family: 'Helvetica Neue', Arial, sans-serif; color: #333; }
    .dash-inner { max-width: 500px; margin: 0 auto; padding: 10px 10px 85px; }
    .d-title { text-align: center; color: #333; font-size: 18px; margin: 10px 0 5px; }
    .d-card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .d-card h3 { font-size: 14px; margin-top: 0; color: #c71585; }
    .d-card h3 small { font-size: 10px; font-weight: normal; color: #888; }
    .d-btn { display: block; width: 100%; padding: 10px; background: #ff69b4; color: white; text-align: center; border-radius: 5px; cursor: pointer; border: none; font-size: 14px; margin-bottom: 15px; font-weight: bold; }
    .d-btn:active { background: #ff1493; }
    .d-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .d-table th, .d-table td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
    .d-table th { background-color: #f8f8f8; }
    .d-table .d-amount { text-align: right; font-weight: bold; color: #c71585; }
    .d-filter label { font-size: 12px; font-weight: bold; color: #c71585; padding: 0; margin: 0; }
    .d-filter select, .d-filter input { width: 100%; height: auto; padding: 8px; border: 2px solid #ffb6c1; border-radius: 5px; margin: 5px 0 0; font-size: 14px; outline: none; color: #444; font-weight: bold; background: #fff; }
    .d-dates { display: flex; gap: 10px; margin-top: 5px; align-items: center; }
    .d-dates span { color: #c71585; font-weight: bold; }
    .d-month-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .d-month-nav button { background: #ffe0ec; border: none; padding: 5px 15px; border-radius: 15px; color: #c71585; font-weight: bold; font-size: 16px; cursor: pointer; }
    .d-month-nav span { font-size: 16px; font-weight: bold; color: #c71585; }
    .d-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; background: #fff; border: 1px solid #ffe0ec; border-radius: 5px; overflow: hidden; }
    .d-cal-head { text-align: center; font-size: 10px; font-weight: bold; color: #ff69b4; padding: 5px 0; background: #fff0f5; }
    .d-cal-cell { min-height: 45px; display: flex; flex-direction: column; padding: 2px 4px; border-top: 1px solid #ffe0ec; border-right: 1px solid #ffe0ec; cursor: pointer; background: #fff; transition: background 0.2s; }
    .d-cal-cell:nth-child(7n) { border-right: none; }
    .d-cal-cell.empty { background: #fafafa; cursor: default; }
    .d-cal-cell.has-data { background: #fffafc; }
    .d-cal-day { font-size: 10px; color: #888; }
    .d-cal-amount { font-size: 9px; color: #c71585; text-align: right; margin-top: auto; font-weight: bold; letter-spacing: -0.5px; }
    .d-cal-zero { font-size: 10px; color: #10b981; text-align: center; font-weight: 900; margin-top: auto; margin-bottom: 1px; background: #ecfdf5; border-radius: 4px; padding: 2px 0; border: 1px solid #a7f3d0; }
    .d-cal-cell.selected { background: #ffb6c1 !important; color: white !important; }
    .d-cal-cell.selected .d-cal-day, .d-cal-cell.selected .d-cal-amount, .d-cal-cell.selected .d-cal-zero { color: white !important; background: transparent; border: none; }
    .d-sum-list { margin: 0; padding: 0; list-style: none; }
    .d-sum-total { font-weight: 900; color: #c71585; font-size: 16px; border-bottom: 2px solid #ffb6c1; padding-bottom: 10px; margin-bottom: 5px; display: flex; justify-content: space-between; }
    .d-sum-wrap { border-bottom: 1px dashed #ffe0ec; }
    .d-sum-wrap:last-child { border-bottom: none; }
    .d-sum-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; font-size: 14px; color: #555; cursor: pointer; }
    .d-sum-item:active { background: #fffafc; }
    .d-sum-amount { font-weight: bold; }
    .d-sum-detail { display: none; background: #fffafc; padding: 8px; border-radius: 5px; margin-bottom: 5px; border: 1px solid #ffe0ec; }

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxF8sDUUD9c9NhVTkC0haw8jBNYxZvLzuk7oe7oEUH_TPqdrI8alAlCMPf1ZTa2XpeE/exec";
    // ログイン（Supabase の Google ログイン）。公開用キーはブラウザに置いてよい種類のキー
    const SUPABASE_URL = "https://iemjvuurpjdhqniiqqnd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_veee8qJLs23sZ1NYyYZgNQ__bi0aIIa";
    const SB_STORAGE_KEY = "sb-iemjvuurpjdhqniiqqnd-auth-token";  // supabase-js がログイン情報を保存するキー
    const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
    const messages = ["登録作業、いつもありがとう！","体調は大丈夫？しっかり寝てね","今日も一日、お疲れ様！","無理しないで、ゆっくり休んでね","いつも家計を支えてくれて感謝！","美味しいもの食べてリラックス♪","少しずつ、理想の家計へ！","明日も素敵な一日になりますように","あなたの頑張り、見てるよ","今日も100点！自分を褒めてね"];

    // 端末に保存するキー
    const KEY_MASTER = "kakeibo.master.v1";   // 前回の action=master 応答
    const KEY_OUTBOX = "kakeibo.outbox.v1";   // 未送信の記録
    const KEY_MEMOS  = "kakeibo.memos.v2";    // 自由記入欄の候補（入力値→分類ごとの回数）
    const KEY_RESULT = "kakeibo.result.seen"; // 「先月の結果」を閉じた月
    const HISTORY_PAGE = 10;

    const $ = id => document.getElementById(id);
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const yen = n => Math.floor(Number(n) || 0).toLocaleString();

    function store(key, fallback) {
      try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
    }
    function save(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }

    function ymd(d) {
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }
    function newLocalId() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
    }

    let master = store(KEY_MASTER, null);
    let outbox = store(KEY_OUTBOX, []);
    let memoStats = store(KEY_MEMOS, { at: 0, memos: {} });
    let justSent = [];      // 送信済みだが、まだ最新の master に反映されていない記録
    let olderHistory = [];  // 「さらに表示」で追加読み込みした記録
    let historyEnd = false; // これ以上古い記録がない
    let loadingMore = false;
    let loadSeq = 0;
    let lastLoadAt = 0;
    let dashStale = false;    // 記録が変わって、分析を読み直す予定がある
    let dashLoading = false;  // 分析のデータを読み込み中
    let dashLoadedAt = 0;
    let dashTimer = null;
    let dashPreloaded = false;
    let appStarted = false;   // ログインを確かめて入力画面を動かし始めた
    let authLost = false;     // ログインが切れた（再ログインまで通信しない）

    // ---------- 通信 ----------

    // ログインが切れた・許可されていないアカウント（通信の失敗とは分けて扱う）
    class AuthError extends Error {}

    // ログイン情報が端末に残っているか（通信できなくても入力画面を出すための判定）
    const hasStoredSession = () => { try { return !!localStorage.getItem(SB_STORAGE_KEY); } catch (e) { return false; } };

    // 送る直前に有効なトークンを得る（期限が近ければ supabase-js が更新する）
    async function getToken() {
      if (!sb) throw new Error("network");
      let session = null;
      try { session = (await sb.auth.getSession()).data.session; } catch (e) {}
      if (session && session.access_token) return session.access_token;
      // 端末にログイン情報が残っているのに取れない＝更新の通信に失敗した。ログインし直しではなく通信エラー扱い
      if (hasStoredSession()) throw new Error("network");
      throw new AuthError("auth");
    }

    // GAS への通信はすべて POST。トークンは本文に入れる（URL に載せない）。
    // Cookie を付けない（Google に複数ログインしている端末で失敗するため）。
    // 独自ヘッダーを付けず FormData で送り、事前確認（OPTIONS）が起きない形にする。
    async function apiOnce(action, fields, timeoutMs, keepalive) {
      const token = await getToken();
      const fd = new FormData();
      fd.append("action", action);
      fd.append("token", token);
      Object.entries(fields).forEach(([k, v]) => fd.append(k, v ?? ""));
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        const res = await fetch(GAS_URL, { method: "POST", body: fd, credentials: "omit", keepalive, signal: ctrl.signal });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const text = await res.text();
        let j = null;
        try { j = JSON.parse(text); } catch (e) {}
        if (!j) throw new Error("bad response");
        if (j.error === "auth") throw new AuthError("auth");
        if (j.ok === false || j.error) throw new Error(j.error || "failed");
        return j;
      } finally {
        clearTimeout(timer);
      }
    }

    async function api(action, fields = {}, { timeout = 20000, retries = 0, keepalive = false } = {}) {
      if (authLost) throw new AuthError("auth");
      for (let i = 0; ; i++) {
        try {
          return await apiOnce(action, fields, timeout, keepalive);
        } catch (e) {
          if (e instanceof AuthError) { onAuthLost(); throw e; }
          if (i >= retries) throw e;
          await sleep(1000 * (i + 1));
        }
      }
    }

    // ---------- ログイン ----------

    function showLogin(message) {
      document.body.classList.remove("booting");
      document.body.classList.add("signed-out");
      $("loginMsg").textContent = message || "";
      $("loginMsg").classList.toggle("show", !!message);
      $("loginBtn").disabled = false;
    }

    // GAS がトークンを受け付けなかった：期限切れか、許可されていないアカウント。
    // 未送信の記録（outbox）は消さずに残し、ログインし直してもらう
    function onAuthLost() {
      if (authLost) return;
      authLost = true;
      const pending = outbox.length ? `（未送信の記録 ${outbox.length}件は、この端末に残っているよ。ログインすると送るね）` : "";
      showLogin("ログインの期限が切れたか、このアカウントでは使えません。家族のGoogleアカウントでログインしてね" + pending);
      if (sb) sb.auth.signOut({ scope: "local" }).catch(() => {});
    }

    $("loginBtn").addEventListener("click", async () => {
      if (!sb) { showLogin("読み込みに失敗しました。通信を確認して、ページを開き直してね"); return; }
      $("loginBtn").disabled = true;
      const { error } = await sb.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: location.origin + location.pathname, queryParams: { prompt: "select_account" } }
      });
      if (error) showLogin("ログインを始められませんでした。もう一度押してね");
    });

    $("logoutBtn").addEventListener("click", async () => {
      const pending = outbox.length ? `\n未送信の記録が ${outbox.length}件あります。端末には残り、次にログインしたときに送ります。` : "";
      if (!confirm("ログアウトする？" + pending)) return;
      // 端末に保存した家計簿のデータを消す（未送信の記録は消さない）
      try { localStorage.removeItem(KEY_MASTER); localStorage.removeItem(KEY_MEMOS); } catch (e) {}
      if (sb) { try { await sb.auth.signOut({ scope: "local" }); } catch (e) {} }
      location.replace(location.origin + location.pathname);
    });

    // ---------- 表示 ----------

    function renderBudget() {
      if (!master || !master.budget) return;
      const b = master.budget;
      $("cur").textContent = yen(b.total);
      $("lim").textContent = yen(b.limit);
      $("bar").style.width = Math.min(100, Number(b.percent) || 0) + "%";

      // 予算は月単位。今日を含めた当月の残り日数で割る
      const now = new Date();
      const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      const daysLeft = lastDay - now.getDate() + 1;
      const rest = Number(b.limit) - Number(b.total);
      const sub = $("budgetSub");
      sub.classList.toggle("over", rest < 0);
      sub.innerHTML = rest >= 0
        ? `<span>残り ${daysLeft}日</span><span>1日あたり <b>¥${yen(rest / daysLeft)}</b></span>`
        : `<span>残り ${daysLeft}日</span><span>予算オーバー <b>¥${yen(-rest)}</b></span>`;
    }

    // 分類ボタンは2行に分けて並べる（grid は入力欄なら "category"、修正パネルなら "eCategory"）
    function renderCategoryChips(grid, cats, current) {
      const chip = c => `<label class="cat-chip"><input type="radio" name="${grid}" value="${esc(c)}" ${c === current ? "checked" : ""}><span>${esc(c)}</span></label>`;
      // 特別費の枠（年で数える分類）は、ふだんの分類と分けて3行目に並べる
      const yearly = new Set(((master && master.cats) || []).filter(c => c.yearly).map(c => c.name));
      const usual = cats.filter(c => !yearly.has(c));
      const special = cats.filter(c => yearly.has(c));
      const half = Math.ceil(usual.length / 2);
      $(grid).innerHTML = [usual.slice(0, half), usual.slice(half)]
        .filter(row => row.length)
        .map(row => `<div class="cat-row">${row.map(chip).join("")}</div>`).join("")
        + (special.length ? `<div class="cat-sub">特別費（年の枠）</div><div class="cat-row special">${special.map(chip).join("")}</div>` : "");
    }

    function renderCategories() {
      const cats = (master && master.categories) || [];
      if (!cats.length) return;
      const current = cats.includes(selectedCategory()) ? selectedCategory() : cats[0];
      renderCategoryChips("category", cats, current);
      renderCatInfo();
    }

    function selectedCategory(grid = "category") {
      const r = document.querySelector(`#${grid} input[name="${grid}"]:checked`);
      return r ? r.value : "";
    }

    function selectCategory(cat, flash, grid = "category") {
      const r = [...document.querySelectorAll(`#${grid} input[name="${grid}"]`)].find(x => x.value === cat);
      if (!r) return;
      r.checked = true;
      if (flash) {
        const chip = r.closest(".cat-chip");
        chip.classList.remove("flash"); void chip.offsetWidth; chip.classList.add("flash");
      }
      if (grid === "category") renderCatInfo();
    }

    // 分類ボタンを光らせて、選び直してもらう
    function promptCategory(grid, hint) {
      const g = $(grid);
      g.classList.remove("pick"); void g.offsetWidth; g.classList.add("pick");
      if (grid === "category") renderCatInfo(hint);
    }

    // ---------- 分類ごとの残り予算 ----------

    // サーバーの実績に、まだ反映されていない記録（送信待ち・送信直後）を足して残りを出す。
    // 変動費は今月、特別費・予備費は今年で数える（年36万円の枠として管理するため）。
    function catStatus(name) {
      const c = ((master && master.cats) || []).find(x => x.name === name);
      if (!c) return null;
      const today = ymd(new Date());
      // 年の枠は数え始めの日（yearFrom）以降・今年の分。月は今月の分
      // 繰り越し型は数え始めからずっと（年をまたいで）数える
      const inSpan = d => c.carry ? d >= String(c.yearFrom || "")
        : c.yearly
        ? d.slice(0, 4) === today.slice(0, 4) && d >= String(c.yearFrom || today.slice(0, 4) + "-01-01")
        : d.slice(0, 7) === today.slice(0, 7);
      const pending = [...outbox, ...justSent]
        .filter(r => r.category === name && inSpan(String(r.date || "")))
        .reduce((sum, r) => sum + (Number(r.amount) || 0), 0);
      const budget = Number(c.yearly ? c.yearBudget : c.budget) || 0;
      const spent = (Number(c.yearly ? c.yearSpent : c.spent) || 0) + pending;
      const rest = budget - spent;
      const span = c.yearly ? "今年" : "今月";
      let text = "";
      if (budget > 0) text = rest >= 0 ? `${name}：${span}あと ¥${yen(rest)}` : `${name}：${span} ¥${yen(-rest)} オーバー`;
      // 繰り越し型：残りは翌年に持ち越す。超えた分は「先取り」として、この先の枠で埋めていく
      if (c.carry && budget > 0) text = rest >= 0 ? `${name}：あと ¥${yen(rest)}` : `${name}：¥${yen(-rest)} 先取り中`;
      // 年の枠の説明。数え始めた年は日割りなので、その旨を出す
      let frame = "";
      if (c.carry && budget > 0) {
        frame = `（残りは繰り越し・毎年 ¥${yen(c.yearFull)} ずつ入るよ）`;
      } else if (c.yearly && budget > 0) {
        const from = String(c.yearFrom || "");
        frame = Number(c.yearFull) > budget && from
          ? `（${Number(from.slice(5, 7))}/${Number(from.slice(8, 10))}〜12/31 の日割り ¥${yen(budget)}）`
          : `（年 ¥${yen(budget)} の枠）`;
      }
      return { text, over: budget > 0 && rest < 0 && !c.carry, note: c.note || "", frame };
    }

    function renderCatInfo(hint) {
      const s = catStatus(selectedCategory());
      const box = $("catInfo");
      if (!s || (!s.text && !s.note && !hint)) { box.hidden = true; return; }
      const remain = $("catRemain");
      remain.className = "cat-remain" + (s.over ? " over" : "");
      remain.innerHTML = esc(s.text) + (s.frame ? `<small>${esc(s.frame)}</small>` : "")
        + (hint ? `<span class="hint">${esc(hint)}</span>` : "");
      $("catNote").textContent = s.note;
      box.hidden = false;
    }
    $("category").addEventListener("change", () => renderCatInfo());

    function renderHistory() {
      // シートにある記録（IDあり）はタップで修正できる
      const itemHtml = (h, state) => {
        const editable = !state && h.id !== "" && h.id != null;
        return `
        <div class="history-item${state ? " pending" : ""}${editable ? " tappable" : ""}"${editable ? ` data-id="${esc(h.id)}"` : ""}>
          <div><div class="h-memo">${esc(h.memo || h.category)}</div><div class="h-sub">${esc(h.date)} · ${esc(h.category)}${state ? ` · <span class="h-state">${state}</span>` : ""}</div></div>
          <div style="display:flex; align-items:center; gap:10px;"><span style="font-weight:900; font-size:16px; color:var(--accent-pink);">¥${yen(h.amount)}</span>${editable ? `<button type="button" class="del-btn" data-del="${esc(h.id)}" aria-label="削除">×</button>` : ""}</div>
        </div>`;
      };
      const short = r => ({ ...r, date: r.date.slice(5).replace("-", "/") });
      const html = [
        ...outbox.map(r => itemHtml(short(r), r.failed ? "未送信" : "送信中…")),
        ...justSent.map(r => itemHtml(short(r), "登録済み")),
        ...serverHistory().map(h => itemHtml(h, ""))
      ].join("");
      $("hList").innerHTML = html || (master ? '<div class="empty-msg">まだ記録がないよ</div>' : "");
      $("moreBtn").hidden = !master || historyEnd || ((master.history || []).length < HISTORY_PAGE);
    }

    // 最新の記録＋追加読み込み分（登録や削除で位置がずれても同じ記録を二重に出さない）
    function serverHistory() {
      const seen = new Set();
      return [...((master && master.history) || []), ...olderHistory].filter(h => {
        const k = String(h.id);
        if (h.id !== "" && seen.has(k)) return false;
        seen.add(k);
        return true;
      });
    }

    async function loadMoreHistory() {
      if (loadingMore) return;
      loadingMore = true;
      const btn = $("moreBtn");
      btn.disabled = true;
      btn.textContent = "読み込み中…";
      try {
        const offset = serverHistory().length;
        const d = await api("history", { offset, limit: HISTORY_PAGE }, { timeout: 12000, retries: 2 });
        const items = (d && d.history) || [];
        olderHistory.push(...items);
        if (items.length < HISTORY_PAGE) historyEnd = true;
      } catch (e) {
        if (!(e instanceof AuthError)) alert("読み込みに失敗しました。もう一度押してね。");
      } finally {
        loadingMore = false;
        btn.disabled = false;
        btn.textContent = "さらに表示";
        renderHistory();
      }
    }
    $("moreBtn").addEventListener("click", loadMoreHistory);

    $("hList").addEventListener("click", e => {
      const delBtn = e.target.closest("[data-del]");
      if (delBtn) { del(delBtn.dataset.del); return; }
      const item = e.target.closest(".history-item[data-id]");
      if (item) openEditor(item.dataset.id);
    });

    function renderSync(loadError) {
      const failed = outbox.filter(r => r.failed).length;
      const bar = $("syncBar");
      if (failed) {
        $("syncMsg").textContent = `📮 未送信 ${failed}件（通信が戻ったら自動で送るね）`;
        $("syncBtn").textContent = "再送する";
        $("syncBtn").onclick = () => flush();
        bar.classList.add("show");
      } else if (loadError) {
        $("syncMsg").textContent = master ? "📶 通信できないので前回のデータを表示中" : "📶 読み込みに失敗しました";
        $("syncBtn").textContent = "再読み込み";
        $("syncBtn").onclick = () => load();
        bar.classList.add("show");
      } else {
        bar.classList.remove("show");
      }
    }

    // 先月の結果。予算内なら余りを返済に回す、という約束のための表示。閉じるまで出す
    function renderResult() {
      const r = master && master.last;
      const card = $("resultCard");
      let seen = "";
      try { seen = localStorage.getItem(KEY_RESULT) || ""; } catch (e) {}
      if (!r || !r.month || seen === r.month) { card.classList.remove("show"); return; }
      const m = Number(r.month.slice(5));
      const rest = Number(r.budget) - Number(r.total);
      const cats = r.cats || [];
      const cleared = cats.filter(c => Number(c.spent) <= Number(c.budget)).length;
      card.classList.toggle("over", rest < 0);
      $("resultTitle").textContent = rest >= 0 ? `🎉 ${m}月は予算クリア！` : `${m}月は ¥${yen(-rest)} オーバー`;
      $("resultSub").innerHTML = (rest >= 0
        ? `余り <b>¥${yen(rest)}</b> は返済に回そう。ふたりともおつかれさま！`
        : `今月は取り返そう。無理せずいこうね`)
        + `<br>¥${yen(r.total)} / ¥${yen(r.budget)}・${cats.length}分類のうち ${cleared}つクリア`;
      card.dataset.month = r.month;
      card.classList.add("show");
    }
    $("resultClose").addEventListener("click", () => {
      const card = $("resultCard");
      try { localStorage.setItem(KEY_RESULT, card.dataset.month || ""); } catch (e) {}
      card.classList.remove("show");
    });

    function renderAll() {
      renderResult();
      renderBudget();
      renderCategories();
      renderHistory();
      renderDateButtons();
    }

    // ---------- 読み込み ----------

    // keepOlder: 修正のように記録の並びが変わらない場合は、追加読み込み分を畳まない
    async function load({ keepOlder = false } = {}) {
      const seq = ++loadSeq;
      const startedAt = Date.now();
      try {
        const d = await api("master", {}, { timeout: 12000, retries: 2 });
        if (seq !== loadSeq) return;
        master = d;
        save(KEY_MASTER, d);
        lastLoadAt = Date.now();
        justSent = justSent.filter(r => r.sentAt >= startedAt);
        // 最新分が入れ替わると追加分との境目がずれるので、追加分は畳んで最初の10件に戻す
        if (!keepOlder) {
          olderHistory = [];
          historyEnd = false;
        }
        renderAll();
        renderSync(false);
        loadMemoStats();
        // 入力画面が整ってから、分析のデータを裏で先に読み込む（開いたときにすぐ見せるため）
        if (!dashPreloaded) { dashPreloaded = true; setTimeout(() => { if (!Dash.hasData() && !dashLoading) refreshDash(); }, 1500); }
      } catch (e) {
        if (seq !== loadSeq || e instanceof AuthError) return;
        renderSync(true);
      }
    }

    // ---------- 自由記入欄の候補 ----------

    // サーバーから「入力値→分類ごとの回数」を取得（1時間に1回まで）
    async function loadMemoStats(force) {
      if (!force && Date.now() - (memoStats.at || 0) < 60 * 60 * 1000) return;
      try {
        const d = await api("memos", {}, { timeout: 15000, retries: 1 });
        if (!d || !Array.isArray(d.memos)) return;
        const memos = {};
        d.memos.forEach(m => { if (m && m.m) memos[m.m] = m.cats || {}; });
        memoStats = { at: Date.now(), memos };
        save(KEY_MEMOS, memoStats);
      } catch (e) {}
    }

    function countMemo(memo, cat) {
      if (!memo) return;
      const cats = memoStats.memos[memo] || (memoStats.memos[memo] = {});
      cats[cat] = (cats[cat] || 0) + 1;
      save(KEY_MEMOS, memoStats);
    }

    // 今ある分類ボタンの中で、その入力値に使われた分類（多い順）
    function memoCategories(memo) {
      const cats = memoStats.memos[memo];
      const current = (master && master.categories) || [];
      if (!cats) return [];
      return Object.entries(cats).filter(([c]) => current.includes(c)).sort((a, b) => b[1] - a[1]);
    }

    // 最も多く使われた分類
    function topCategory(memo) {
      return memoCategories(memo)[0]?.[0] || "";
    }

    // いくつかの分類で使っているお店（スーパーで食べ物と日用品を買うなど）。
    // 分類ごとに分けて入力するルールなので、こういうお店では分類を自動で選ばない
    function isMixedMemo(memo) {
      const list = memoCategories(memo);
      if (list.length < 2) return false;
      const [top, second] = [list[0][1], list[1][1]];
      return second >= 2 && second >= top * 0.15;
    }

    // ひらがな・カタカナ・全角半角・大文字小文字の違いを無視して比べる
    const normalize = s => String(s).normalize("NFKC").toLowerCase()
      .replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));

    // 入力中の文字で始まるものを優先し、次に含むものを、よく使う順に最大6件
    function renderAutocomplete(input, list) {
      const q = normalize(input.value.trim());
      if (!q || document.activeElement !== input) { list.classList.remove("show"); return; }
      const scored = Object.entries(memoStats.memos).map(([m, cats]) => {
        const n = normalize(m);
        const rank = n.startsWith(q) ? 0 : n.includes(q) ? 1 : -1;
        return { m, rank, count: Object.values(cats).reduce((a, b) => a + b, 0) };
      }).filter(x => x.rank >= 0)
        .sort((a, b) => a.rank - b.rank || b.count - a.count)
        .slice(0, 6);
      list.innerHTML = scored.map(x => {
        const cat = isMixedMemo(x.m)
          ? memoCategories(x.m).slice(0, 2).map(([c]) => c).join("・") + "など"
          : topCategory(x.m);
        return `<div class="ac-item" data-memo="${esc(x.m)}"><span>${esc(x.m)}</span>${cat ? `<small>${esc(cat)}</small>` : ""}</div>`;
      }).join("");
      list.classList.toggle("show", scored.length > 0);
    }

    // 自由記入欄に予測候補をつける。候補を選ぶと、よく使う分類を grid で選ぶ
    function attachAutocomplete(input, list, grid) {
      const render = () => renderAutocomplete(input, list);
      input.addEventListener("input", render);
      input.addEventListener("compositionupdate", () => setTimeout(render, 0));
      input.addEventListener("focus", render);
      input.addEventListener("blur", () => setTimeout(() => list.classList.remove("show"), 150));
      // 候補をタップしても入力欄のフォーカスが外れないようにする
      list.addEventListener("pointerdown", e => e.preventDefault());
      list.addEventListener("click", e => {
        const item = e.target.closest(".ac-item");
        if (!item) return;
        const memo = item.dataset.memo;
        input.value = memo;
        input.dispatchEvent(new Event("memo-picked"));
        if (isMixedMemo(memo)) {
          promptCategory(grid, "いくつかの分類で使うお店だよ。分類を選んでね");
        } else {
          const cat = topCategory(memo);
          if (cat) selectCategory(cat, true, grid);
        }
        list.classList.remove("show");
        input.blur();
      });
    }
    attachAutocomplete($("memo"), $("acList"), "category");
    attachAutocomplete($("eMemo"), $("eAcList"), "eCategory");

    // ---------- 日付 ----------

    // 「今日」「昨日」ボタンの選択状態。入力欄の日付は空欄なら今日扱い
    function renderDateButtons() {
      const today = ymd(new Date());
      const y = new Date(); y.setDate(y.getDate() - 1);
      document.querySelectorAll(".date-quick").forEach(group => {
        const v = $(group.dataset.target).value || (group.dataset.target === "date" ? today : "");
        group.querySelectorAll("button").forEach(b => {
          b.classList.toggle("on", v === (b.dataset.days === "0" ? today : ymd(y)));
        });
      });
    }
    document.querySelectorAll(".date-quick").forEach(group => {
      group.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
        const d = new Date(); d.setDate(d.getDate() - Number(b.dataset.days));
        $(group.dataset.target).value = ymd(d);
        renderDateButtons();
      }));
      $(group.dataset.target).addEventListener("change", renderDateButtons);
    });

    // ---------- 登録（端末に保存してから非同期で送信） ----------

    $("f").addEventListener("submit", e => {
      e.preventDefault();
      const b = $("subBtn");
      b.disabled = true;
      setTimeout(() => { b.disabled = false; }, 400);

      const amount = $("f").amount.value.replace(/[^0-9]/g, "");
      if (!amount) return;
      const rec = {
        localId: newLocalId(),
        amount: Number(amount),
        category: selectedCategory(),
        memo: $("memo").value.trim(),
        // 後で再送されても日付がずれないよう、空欄なら記録した日の日付を入れておく
        date: $("date").value || ymd(new Date())
      };
      outbox.push(rec);
      save(KEY_OUTBOX, outbox);
      countMemo(rec.memo, rec.category);

      const cat = rec.category;
      // 「同じお店でもう1件」用に、お店と日付（空欄なら空欄のまま）を覚えておく
      lastEntry = rec.memo ? { memo: rec.memo, date: $("date").value } : null;
      e.target.reset();
      selectCategory(cat);
      $("acList").classList.remove("show");
      $("againName").textContent = lastEntry ? lastEntry.memo : "";
      $("againBtn").hidden = !lastEntry;
      renderHistory();
      renderDateButtons();
      renderCatInfo();
      flush();
    });

    // ---------- 同じお店でもう1件 ----------

    // 同じお店で食べ物と日用品を買ったときなど、分類ごとに分けて入力するためのボタン。
    // お店と日付をそのまま戻し、金額と分類だけ入れ直してもらう
    let lastEntry = null;
    $("againBtn").addEventListener("click", () => {
      if (!lastEntry) return;
      $("memo").value = lastEntry.memo;
      $("date").value = lastEntry.date;
      $("againBtn").hidden = true;
      renderDateButtons();
      promptCategory("category", "さっきと違う分類を選んでね");
      $("f").amount.focus();
    });
    // 別のお店を入れ始めたら、ボタンは引っ込める
    const hideAgain = () => { $("againBtn").hidden = true; };
    $("memo").addEventListener("input", hideAgain);
    $("memo").addEventListener("memo-picked", hideAgain);

    let flushing = false;
    async function flush() {
      if (flushing || !outbox.length || authLost) return;
      flushing = true;
      let sentAny = false;
      try {
        // 送信中に追加された記録も続けて送る
        while (outbox.length) {
          const rec = outbox[0];
          rec.failed = false;
          renderHistory();
          try {
            await api("add", { localId: rec.localId, amount: rec.amount, category: rec.category, method: "", memo: rec.memo, date: rec.date }, { keepalive: true });
            outbox = outbox.filter(r => r.localId !== rec.localId);
            save(KEY_OUTBOX, outbox);
            justSent.unshift({ ...rec, sentAt: Date.now() });
            sentAny = true;
            // 登録した分類の残り予算を知らせる（予算のない分類はいつもの言葉）
            const st = catStatus(rec.category);
            showToast("登録完了！", st && st.text ? st.text : undefined);
            renderCatInfo();
          } catch (err) {
            // 通信が不調なら残りは次の機会にまとめて送る
            outbox.forEach(r => { r.failed = true; });
            save(KEY_OUTBOX, outbox);
            break;
          }
        }
      } finally {
        flushing = false;
        renderHistory();
        renderSync(false);
      }
      if (sentAny) {
        scheduleDashRefresh();
        load();
      }
    }

    let toastTimer;
    function showToast(title = "登録完了！", sub = "家計簿を更新したよ♪") {
      $("tstTitle").textContent = title;
      $("tstSub").textContent = sub;
      const tst = $("tst");
      tst.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => tst.classList.remove("show"), 2500);
    }

    // ---------- 削除 ----------

    // 確認して削除する。消した場合は true
    async function del(id) {
      if (!confirm("この記録を消してもいい？")) return false;
      if (master && master.history) {
        master.history = master.history.filter(h => String(h.id) !== String(id));
        olderHistory = olderHistory.filter(h => String(h.id) !== String(id));
        renderHistory();
      }
      try {
        await api("delete", { rowId: id }, { keepalive: true });
        scheduleDashRefresh();
      } catch (e) {
        if (e instanceof AuthError) return true;
        alert("削除に失敗しました。");
      }
      load();
      return true;
    }

    // ---------- 修正 ----------

    let editing = null;  // 修正中の記録

    // 古いキャッシュの記録は "MM/dd" しかないので年を補う（未来の月なら前年）
    function historyYmd(h) {
      if (h.ymd) return h.ymd;
      const m = /^(\d{2})\/(\d{2})$/.exec(h.date || "");
      if (!m) return ymd(new Date());
      const now = new Date();
      const year = Number(m[1]) > now.getMonth() + 1 ? now.getFullYear() - 1 : now.getFullYear();
      return `${year}-${m[1]}-${m[2]}`;
    }

    function openEditor(id) {
      const h = serverHistory().find(x => String(x.id) === String(id));
      if (!h) return;
      editing = h;
      // 今はない分類（旧名など）の記録も、そのまま保存できるように選択肢に加える
      const cats = [...((master && master.categories) || [])];
      if (h.category && !cats.includes(h.category)) cats.push(h.category);
      renderCategoryChips("eCategory", cats, h.category);
      $("eAmount").value = h.amount;
      $("eMemo").value = h.memo || "";
      $("eDate").value = historyYmd(h);
      renderDateButtons();
      $("editSave").disabled = false;
      $("editSave").textContent = "保存する";
      $("editBackdrop").classList.add("show");
      $("editSheet").classList.add("show");
    }

    function closeEditor() {
      editing = null;
      $("eAcList").classList.remove("show");
      $("editBackdrop").classList.remove("show");
      $("editSheet").classList.remove("show");
    }

    $("editClose").addEventListener("click", closeEditor);
    $("editBackdrop").addEventListener("click", closeEditor);
    document.addEventListener("keydown", e => { if (e.key === "Escape" && editing) closeEditor(); });

    $("editDelete").addEventListener("click", async () => {
      if (!editing) return;
      const id = editing.id;
      if (await del(id)) closeEditor();
    });

    $("ef").addEventListener("submit", async e => {
      e.preventDefault();
      if (!editing) return;
      const amount = $("eAmount").value.replace(/[^0-9]/g, "");
      const date = $("eDate").value;
      if (!amount || !date) return;
      const rec = { amount: Number(amount), category: selectedCategory("eCategory"), memo: $("eMemo").value.trim(), date };
      const btn = $("editSave");
      btn.disabled = true;
      btn.textContent = "保存中…";
      try {
        await api("update", { rowId: editing.id, ...rec }, { keepalive: true });
        // 画面上の記録をすぐ書き換え、裏で予算などを読み直す
        const patch = h => String(h.id) === String(editing.id)
          ? { ...h, ...rec, ymd: date, date: date.slice(5).replace("-", "/") } : h;
        if (master && master.history) master.history = master.history.map(patch);
        olderHistory = olderHistory.map(patch);
        countMemo(rec.memo, rec.category);
        renderHistory();
        closeEditor();
        showToast("修正完了！", "記録を直したよ♪");
        scheduleDashRefresh();
        load({ keepOlder: true });
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "保存する";
        if (err instanceof AuthError) { closeEditor(); return; }
        alert("保存できませんでした。通信状態を確認して、もう一度試してね。");
      }
    });

    // ---------- タブ切り替え ----------

    // ---------- 分析タブ（データを裏で読み込んでおき、画面内で描く） ----------

    // 分析画面の描画。以前 GAS の分析画面（iframe）でしていたことを、そのままこの画面で行う
    const Dash = (() => {
      let rows = null;          // { date: "yyyy/MM/dd", category, amount, memo }
      let catFilter = null;     // 円グラフでタップした分類
      let dateFilter = null;    // カレンダーでタップした日
      let sortState = {};       // サマリーの分類ごとの並び順 { 0: { key: "date", dir: "desc" } }
      let summary = [];
      let pie = null;
      let chartLoading = null;
      const viewMonth = new Date(); viewMonth.setDate(1);
      const COLORS = ["#ff99cc", "#ffb366", "#99ccff", "#99ffcc", "#cc99ff", "#ffff99", "#d9d9d9"];

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = src; s.onload = resolve; s.onerror = reject;
          document.head.appendChild(s);
        });
      }
      // グラフの部品は分析を初めて描くときに読み込む（入力画面の表示を遅くしない）
      function loadChart() {
        if (window.Chart && window.ChartDataLabels) return Promise.resolve();
        if (!chartLoading) {
          chartLoading = loadScript("https://cdn.jsdelivr.net/npm/chart.js@4")
            .then(() => loadScript("https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"))
            .catch(e => { chartLoading = null; throw e; });
        }
        return chartLoading;
      }

      const period = () => $("dPeriod").value;
      const pad = n => String(n).padStart(2, "0");
      const dateKey = d => d.getFullYear() + "/" + pad(d.getMonth() + 1) + "/" + pad(d.getDate());
      const toDate = s => new Date(String(s).replace(/\//g, "-") + "T00:00:00");

      function baseRows() {
        if (period() === "all") return rows;
        let start, end;
        if (period() === "monthly") {
          start = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), 1);
          end = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 0, 23, 59, 59);
        } else {
          const from = $("dFrom").value, to = $("dTo").value;
          start = from ? new Date(from + "T00:00:00") : new Date("2000-01-01T00:00:00");
          end = to ? new Date(to + "T23:59:59") : new Date("2099-12-31T23:59:59");
        }
        return rows.filter(d => { const t = toDate(d.date); return t >= start && t <= end; });
      }

      function render() {
        if (!rows) return;
        $("dashLoading").style.display = "none";
        $("dashApp").hidden = false;
        $("dCustom").hidden = period() !== "custom";
        $("dCalSection").style.display = period() === "monthly" ? "" : "none";

        const base = baseRows();
        if (period() === "monthly") renderCalendar(catFilter ? base.filter(d => d.category === catFilter) : base);

        const sumRows = dateFilter ? base.filter(d => d.date === dateFilter) : base;
        renderSummary(sumRows);
        renderPie(sumRows);

        let tableRows = base;
        if (catFilter) tableRows = tableRows.filter(d => d.category === catFilter);
        if (dateFilter) tableRows = tableRows.filter(d => d.date === dateFilter);
        renderTable(tableRows);
      }

      function renderCalendar(data) {
        const year = viewMonth.getFullYear(), month = viewMonth.getMonth();
        $("dMonth").textContent = `${year}年${month + 1}月`;
        const todayStr = dateKey(new Date());
        const agg = {};
        data.forEach(d => { agg[d.date] = (agg[d.date] || 0) + d.amount; });

        let html = ["日", "月", "火", "水", "木", "金", "土"].map(w => `<div class="d-cal-head">${w}</div>`).join("");
        const firstDay = new Date(year, month, 1).getDay();
        const days = new Date(year, month + 1, 0).getDate();
        for (let i = 0; i < firstDay; i++) html += `<div class="d-cal-cell empty"></div>`;
        for (let d = 1; d <= days; d++) {
          const key = `${year}/${pad(month + 1)}/${pad(d)}`;
          const amount = agg[key] || 0;
          const cls = ["d-cal-cell", amount > 0 ? "has-data" : "", dateFilter === key ? "selected" : ""].join(" ");
          const body = amount > 0 ? `<div class="d-cal-amount">¥${yen(amount)}</div>`
            : key <= todayStr ? `<div class="d-cal-zero">✨¥0</div>` : "";
          html += `<div class="${cls}" data-date="${key}"><div class="d-cal-day">${d}</div>${body}</div>`;
        }
        $("dCal").innerHTML = html;
      }

      function renderSummary(data) {
        const sec = $("dSummary");
        if (!data.length) { sec.innerHTML = '<div class="d-empty">データがありません</div>'; summary = []; return; }
        let total = 0;
        const agg = {};
        data.forEach(d => {
          total += d.amount;
          (agg[d.category] || (agg[d.category] = { total: 0, items: [] })).total += d.amount;
          agg[d.category].items.push(d);
        });
        summary = Object.keys(agg).map(cat => ({ cat, total: agg[cat].total, items: agg[cat].items }))
          .sort((a, b) => b.total - a.total);
        sec.innerHTML = `<div class="d-sum-total"><span>合計</span><span class="d-sum-amount">¥${yen(total)}</span></div>`
          + `<ul class="d-sum-list">` + summary.map((g, i) => `
            <li class="d-sum-wrap" data-index="${i}">
              <div class="d-sum-item" data-toggle="${i}"><span>${esc(g.cat)} <span class="d-toggle">▼</span></span><span class="d-sum-amount">¥${yen(g.total)}</span></div>
              <div class="d-sum-detail"><div id="dItems${i}"></div></div>
            </li>`).join("") + `</ul>`;
        summary.forEach((g, i) => renderDetail(i));
      }

      function renderDetail(i) {
        const st = sortState[i] || { key: "date", dir: "desc" };
        const items = [...summary[i].items].sort((a, b) => {
          let r;
          if (st.key === "amount") r = a.amount - b.amount;
          else if (st.key === "memo") r = String(a.memo || "").localeCompare(String(b.memo || ""));
          else r = toDate(a.date) - toDate(b.date);
          return st.dir === "asc" ? r : -r;
        });
        const btn = (key, label) => {
          const arrow = st.key === key ? (st.dir === "desc" ? "↓" : "↑") : "";
          return `<div class="d-sort${st.key === key ? " active" : ""}" data-sort="${i}" data-key="${key}">${label} ${arrow}</div>`;
        };
        $("dItems" + i).innerHTML = `<div class="d-controls">${btn("date", "📅 日付")}${btn("memo", "📝 使途")}${btn("amount", "💰 金額")}</div>`
          + items.map(it => `<div class="d-detail-item"><span class="d-detail-name">${esc(String(it.date).slice(5))} ${esc(it.memo || "(未記入)")}</span><span class="d-detail-amount">¥${yen(it.amount)}</span></div>`).join("");
      }

      function sortDetail(i, key) {
        const st = sortState[i] || (sortState[i] = { key: "date", dir: "desc" });
        if (st.key === key) st.dir = st.dir === "desc" ? "asc" : "desc";
        else { st.key = key; st.dir = (key === "amount" || key === "date") ? "desc" : "asc"; }
        renderDetail(i);
      }

      function renderTable(data) {
        $("dTable").innerHTML = [...data].sort((a, b) => toDate(b.date) - toDate(a.date)).map(r =>
          `<tr><td>${esc(String(r.date).slice(5))}</td><td>${esc(r.category)}</td><td>${esc(r.memo)}</td><td class="d-amount">¥${yen(r.amount)}</td></tr>`).join("");
      }

      function renderPie(data) {
        if (!window.Chart || !window.ChartDataLabels) {
          loadChart().then(() => { if (rows) render(); }).catch(() => {});
          return;
        }
        const agg = {};
        data.forEach(d => { agg[d.category] = (agg[d.category] || 0) + d.amount; });
        const labels = Object.keys(agg);
        if (pie) pie.destroy();
        pie = new Chart($("dPie").getContext("2d"), {
          type: "doughnut",
          plugins: [ChartDataLabels],
          data: { labels, datasets: [{ data: Object.values(agg), backgroundColor: COLORS }] },
          options: {
            plugins: {
              datalabels: {
                color: "#ffffff", font: { weight: "bold", size: 11 },
                textStrokeColor: "rgba(0,0,0,0.4)", textStrokeWidth: 3, textAlign: "center",
                formatter: (value, ctx) => {
                  const total = ctx.dataset.data.reduce((a, c) => a + c, 0);
                  if (!total) return null;
                  const pct = value / total * 100;
                  return pct >= 5 ? ctx.chart.data.labels[ctx.dataIndex] + "\n" + Math.round(pct) + "%" : null;
                }
              }
            },
            onClick: (e, active) => { if (active.length) { catFilter = labels[active[0].index]; render(); } }
          }
        });
      }

      // 操作
      $("dPeriod").addEventListener("change", () => { dateFilter = null; render(); });
      $("dFrom").addEventListener("change", render);
      $("dTo").addEventListener("change", render);
      $("dReset").addEventListener("click", () => { catFilter = null; dateFilter = null; render(); });
      $("dPrev").addEventListener("click", () => { viewMonth.setMonth(viewMonth.getMonth() - 1); dateFilter = null; render(); });
      $("dNext").addEventListener("click", () => { viewMonth.setMonth(viewMonth.getMonth() + 1); dateFilter = null; render(); });
      $("dCal").addEventListener("click", e => {
        const cell = e.target.closest(".d-cal-cell[data-date]");
        if (!cell) return;
        dateFilter = dateFilter === cell.dataset.date ? null : cell.dataset.date;
        render();
      });
      $("dSummary").addEventListener("click", e => {
        const s = e.target.closest("[data-sort]");
        if (s) { sortDetail(Number(s.dataset.sort), s.dataset.key); return; }
        const t = e.target.closest("[data-toggle]");
        if (t) t.closest(".d-sum-wrap").classList.toggle("open");
      });

      return {
        hasData: () => !!rows,
        setRows(r) {
          rows = (r || []).map(x => ({ date: String(x.date), category: String(x.category), amount: Number(x.amount) || 0, memo: x.memo == null ? "" : String(x.memo) }));
          sortState = {};
          if ($("view-dashboard").classList.contains("show")) render();
        },
        render,
        loadChart
      };
    })();

    function updateDashBadge() {
      // 表示中の分析があり、それが古くなる（または読み直し中）ときだけ知らせる
      $("dashUpdating").style.display = (Dash.hasData() && (dashStale || dashLoading)) ? "block" : "none";
    }

    // 分析のデータを読み直す。読み終わるまでは前のデータを表示したままにする（空白を見せない）
    async function refreshDash() {
      clearTimeout(dashTimer);
      if (dashLoading || authLost) return;
      dashLoading = true;
      dashStale = false;
      updateDashBadge();
      try {
        const d = await api("dashboard", {}, { timeout: 30000, retries: 1 });
        Dash.setRows(d.rows);
        dashLoadedAt = Date.now();
      } catch (e) {
        if (!Dash.hasData() && !(e instanceof AuthError)) $("dashLoading").textContent = "📶 分析を読み込めませんでした。タブを開き直すと、もう一度読み込むよ";
      } finally {
        dashLoading = false;
        updateDashBadge();
      }
    }

    // 記録が変わったら、少し待ってまとめて読み直す
    function scheduleDashRefresh(delay = 3000) {
      dashStale = true;
      clearTimeout(dashTimer);
      dashTimer = setTimeout(refreshDash, delay);
      updateDashBadge();
    }

    window.switchTab = function(target) {
      if(target === 'input') {
        $('view-input').style.display = 'block';
        $('view-dashboard').classList.remove('show');
        $('tab-input').classList.add('active');
        $('tab-dashboard').classList.remove('active');
      } else {
        if (!Dash.hasData() && !dashLoading) { $("dashLoading").textContent = "📊 分析を準備中…"; refreshDash(); }
        Dash.loadChart().catch(() => {});
        updateDashBadge();
        $('view-input').style.display = 'none';
        $('view-dashboard').classList.add('show');
        $('tab-input').classList.remove('active');
        $('tab-dashboard').classList.add('active');
        if (Dash.hasData()) Dash.render();
      }
    };

    // ---------- 起動 ----------

    // ログインを確かめてから入力画面を動かす。ログイン前は GAS を一切呼ばない
    function startApp(session) {
      if (session && session.user) $("accountEmail").textContent = session.user.email || "";
      if (appStarted) return;
      appStarted = true;
      document.body.classList.remove("booting", "signed-out");
      $("randomMsg").textContent = messages[Math.floor(Math.random() * messages.length)];
      outbox.forEach(r => { r.failed = true; });  // 前回送れなかった分
      renderAll();
      renderSync(false);
      load();
      flush();

      window.addEventListener("online", () => { flush(); load(); });
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState !== "visible" || authLost) return;
        flush();
        if (Date.now() - lastLoadAt > 60 * 1000) load();
        // 開きっぱなしで古くなった分析（他の端末での登録など）を裏で読み直す
        if (Dash.hasData() && !dashLoading && Date.now() - dashLoadedAt > 5 * 60 * 1000) scheduleDashRefresh(1000);
        renderBudget();
        renderDateButtons();
      });
      setInterval(() => { if (!authLost && outbox.some(r => r.failed)) flush(); }, 30 * 1000);
    }

    async function boot() {
      // 端末にログイン情報があれば、通信を待たずに入力画面を出す（電波がなくても記録できるように）
      if (hasStoredSession()) startApp(null);
      if (!sb) { if (!appStarted) showLogin("読み込みに失敗しました。通信を確認して、ページを開き直してね"); return; }

      // Google から戻ってきたとき（URL にログイン結果が付いている）は、ここで読み取られる
      let session = null;
      try { session = (await sb.auth.getSession()).data.session; } catch (e) {}
      if (session) {
        startApp(session);
        // ログイン結果が付いた URL を、履歴に残らない形で消す
        if (location.hash.includes("access_token") || location.search.includes("code=")) history.replaceState(null, "", location.pathname);
      } else if (!appStarted) {
        showLogin(/error_description=/.test(location.hash + location.search) ? "ログインできませんでした。もう一度試してね" : "");
      }

      sb.auth.onAuthStateChange((event, s) => {
        if (event === "SIGNED_IN" && s && !authLost) startApp(s);
      });
    }
    boot();
  </script>
</body>
</html>
