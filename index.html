<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>名和家の家計簿！</title>

  <style>
    :root{
      --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --bg:#f7f7fb;
      --btnColor: linear-gradient(135deg, rgba(236,72,153,.92), rgba(167,139,250,.92));
    }

    html,body{ margin:0; padding:0; background: var(--bg); font-family: sans-serif; height: 100%; overflow: hidden; }
    *{ box-sizing: border-box; touch-action: manipulation; }

    /* 背景と画像の修正 */
    body::before {
      content:""; position:fixed; inset:0; z-index:0;
      background: radial-gradient(circle at 15% 10%, rgba(236,72,153,0.1), transparent);
    }

    /* ポム画像：背景として透過表示 */
    #bg-image {
      position: fixed; inset: 0; pointer-events: none; z-index: -1;
      opacity: 0.15; background-repeat: no-repeat; background-position: center 20%;
      background-size: min(300px, 70vw);
    }

    .page { max-width: 600px; margin: 0 auto; padding: 16px; height: 100svh; overflow-y: auto; position: relative; z-index: 1; }
    
    .budget-card {
      background: rgba(255,255,255,0.8); border-radius: 16px; padding: 12px;
      margin-bottom: 16px; backdrop-filter: blur(5px);
    }
    .budget-bar-bg { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; margin-top: 8px; }
    .budget-bar-fill { height: 100%; background: #34d399; transition: width 0.5s; }

    .card { background: rgba(255,255,255,0.9); border-radius: 20px; padding: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    
    label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
    
    /* 金額入力のUI修正 */
    .amount-input-wrapper { position: relative; display: flex; align-items: center; }
    .currency-symbol { position: absolute; left: 12px; font-weight: bold; font-size: 20px; color: #ec4893; }
    input[name="amount"] { padding-left: 35px !important; font-size: 24px !important; font-weight: 900; color: #ec4893; }

    input, select, textarea {
      width: 100%; border: 1px solid #ddd; border-radius: 12px; padding: 12px;
      font-size: 16px; outline: none; margin-bottom: 12px; background: #fff;
    }

    .btn {
      width: 100%; border: none; border-radius: 14px; padding: 16px;
      background: var(--btnColor); color: #fff; font-weight: bold; font-size: 18px;
    }

    /* 履歴 */
    .history-item {
      background: rgba(255,255,255,0.7); border-radius: 12px; padding: 10px;
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    }
    .del-btn { color: #ef4444; border: none; background: none; font-size: 20px; cursor: pointer; }
  </style>
</head>

<body>
  <div id="bg-image"></div>
  <div class="page">
    <div class="budget-card" id="budgetCard">
      <div style="display:flex; justify-content:space-between; font-size:13px; font-weight:bold;">
        <span>今月の実績</span>
        <span><span id="currentTotal">0</span> / <span id="budgetLimit">0</span></span>
      </div>
      <div class="budget-bar-bg"><div class="budget-bar-fill" id="budgetBar"></div></div>
    </div>

    <div class="card">
      <form id="f">
        <label>金額</label>
        <div class="amount-input-wrapper">
          <span class="currency-symbol">¥</span>
          <input name="amount" type="tel" inputmode="numeric" placeholder="0" required>
        </div>

        <label>カテゴリ</label>
        <select id="category" name="category" required></select>

        <label>支払方法</label>
        <select id="method" name="method" required></select>

        <label>メモ（店名など）</label>
        <input name="memo" placeholder="例：コープ">

        <label>日付（空欄なら今日）</label>
        <input name="date" type="date">

        <button class="btn" type="submit" id="submitBtn">記録する</button>
      </form>
    </div>

    <div style="margin-top:20px;">
      <div style="font-size:14px; font-weight:bold; color:var(--muted); margin-bottom:10px;">直近5件の履歴</div>
      <div id="historyList"></div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycby31bFD85uYThxMWBEOptm7OU1ucc4EmZssDbO2Kbm_nUNemLpDgS_dhEZ-7cyCNDzN/exec";
    const POM_IMG_PATH = "icons/Gemini_Generated_Image_va05a4va05a4va05_transparent.png";

    async function loadData() {
        // 画像を即座にセット
        document.getElementById('bg-image').style.backgroundImage = `url('${POM_IMG_PATH}')`;

        const data = await jsonp(GAS_URL + "?action=master");
        
        // 予算反映
        document.getElementById("currentTotal").textContent = "¥" + Number(data.budget.total).toLocaleString();
        document.getElementById("budgetLimit").textContent = "¥" + Number(data.budget.limit).toLocaleString();
        document.getElementById("budgetBar").style.width = data.budget.percent + "%";

        // プルダウン
        const fill = (id, list) => {
          const el = document.getElementById(id);
          el.innerHTML = list.map(v => `<option value="${v}">${v}</option>`).join('');
        };
        fill("category", data.categories);
        fill("method", data.methods);

        // 履歴反映
        document.getElementById("historyList").innerHTML = data.history.map(h => `
          <div class="history-item">
            <div>
              <div style="font-weight:bold;">${h.memo || h.category}</div>
              <div style="font-size:11px; color:#999;">${h.date} · ${h.category}</div>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
              <span style="font-weight:bold;">¥${Number(h.amount).toLocaleString()}</span>
              <button class="del-btn" onclick="deleteItem('${h.id}')">×</button>
            </div>
          </div>
        `).join('');
    }

    // 削除処理
    window.deleteItem = async (id) => {
      if(!confirm("削除しますか？")) return;
      const fd = new FormData(); fd.set("action", "delete"); fd.set("rowId", id);
      await fetch(GAS_URL, { method: "POST", body: fd });
      loadData();
    };

    document.getElementById("f").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      const fd = new FormData(ev.target);
      
      // 金額のクレンジング
      const amt = fd.get("amount").replace(/[^0-9]/g, "");
      fd.set("amount", amt);

      await fetch(GAS_URL, { method: "POST", body: fd, keepalive: true });
      ev.target.reset();
      btn.disabled = false;
      loadData();
    });

    function jsonp(url) {
      return new Promise(res => {
        const cb = "cb" + Date.now();
        window[cb] = d => { res(d); document.head.removeChild(s); };
        const s = document.createElement("script");
        s.src = `${url}&callback=${cb}`;
        document.head.appendChild(s);
      });
    }

    loadData();
  </script>
</body>
</html>
