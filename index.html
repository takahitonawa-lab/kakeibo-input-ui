<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
  <title>家計入力</title>

<!-- iOS ホーム画面用（最重要） -->
<link rel="apple-touch-icon" sizes="180x180" href="/icons/180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家計入力">

<!-- PWA用（おすすめ） -->
<link rel="manifest" href="/manifest.webmanifest">

<!-- ブラウザタブ用（任意） -->
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="/icons/favicon-16.png" sizes="16x16">
  
  <style>
    :root{
      --ink:#111827; --muted:#6b7280;
      --line:#e5e7eb;
      --bg:#f7f7fb;
      --btnText:#fff;

      /* ✅ 9割（transform禁止、変数で縮める） */
      --k: .9;

      --radius: calc(18px * var(--k));
      --title:  calc(34px * var(--k));
      --sub:    calc(16px * var(--k));
      --label:  calc(16px * var(--k));
      --ctrl:   calc(22px * var(--k));
      --padY:   calc(16px * var(--k));
      --padX:   calc(14px * var(--k));
      --gap:    calc(12px * var(--k)); /* ✅ 少し詰めた */

      --shadowSoft: 0 14px 30px rgba(17, 24, 39, .10);
      --shadowPop:  0 18px 45px rgba(17, 24, 39, .18);
      --ring: 0 0 0 4px rgba(236, 72, 153, .12);
    }

    html,body{
      margin:0;padding:0;
      color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP","Helvetica Neue",Arial;
      -webkit-text-size-adjust:100%;
      background: var(--bg);
      overflow:hidden; /* ✅ ページ全体のスクロールを殺す */
    }

    *{ touch-action: manipulation; }

    /* ✅ 背景グラデ：固定でズレない */
    body::before{
      content:"";
      position:fixed; inset:0;
      pointer-events:none;
      background:
        radial-gradient(1200px 600px at 15% 8%, rgba(236,72,153,.18), transparent 60%),
        radial-gradient(900px 500px at 90% 15%, rgba(56,189,248,.20), transparent 55%),
        radial-gradient(900px 500px at 80% 90%, rgba(167,139,250,.16), transparent 55%),
        transparent;
      z-index:0;
    }

    /* ✅ pom：右上固定（カードの上に重ねる） */
    body.hasPom::after{
      content:"";
      position:fixed; inset:0;
      pointer-events:none;
      opacity:.25;
      background-repeat:no-repeat;
      background-position:right 10px top 10px;   /* ✅ 右上 */
      background-size: min(250px, 34vw);
      background-image: var(--pomBg);
      z-index:3;
      filter: drop-shadow(0 10px 14px rgba(17,24,39,.18));
    }

    .page{
      max-width: 760px;
      margin:0 auto;
      height: 100svh;         /* ✅ 高さを固定して溢れを抑制 */
      padding: calc(12px * var(--k)) calc(12px * var(--k)) calc(10px * var(--k));
      box-sizing:border-box;

      display:flex;
      flex-direction:column;
      gap: calc(10px * var(--k));
      position:relative;
      z-index:1;
    }

    .title{
      font-size:var(--title);
      font-weight:900;
      margin: calc(4px * var(--k)) 0 0;
      letter-spacing:.2px;
      display:flex;
      align-items:center;
      gap: calc(10px * var(--k));
    }
    .title::before{
      content:"🍮";
      display:inline-flex;
      width: calc(40px * var(--k));
      height: calc(40px * var(--k));
      align-items:center;justify-content:center;
      border-radius: calc(14px * var(--k));
      background: rgba(255,255,255,.75);
      border: 1px solid rgba(229,231,235,.8);
      box-shadow: var(--shadowSoft);
      backdrop-filter: blur(8px);
    }

    .subtitle{
      font-size:var(--sub);
      color:var(--muted);
      margin:0;
    }

    /* ✅ cardを少しだけコンパクトに */
    .card{
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(229,231,235,.85);
      border-radius: calc(26px * var(--k));
      padding: calc(12px * var(--k)) calc(12px * var(--k)) calc(12px * var(--k));
      box-shadow: var(--shadowSoft);
      backdrop-filter: blur(10px);
      overflow:hidden;
    }

    form{display:flex;flex-direction:column;gap:var(--gap);}

    label{
      display:block;
      font-size:var(--label);
      color:var(--muted);
      margin:0 0 calc(6px * var(--k)); /* ✅ 少し詰めた */
      letter-spacing:.1px;
    }

    input,select,textarea{
      width:100%;box-sizing:border-box;
      border:1px solid rgba(229,231,235,.95);
      border-radius: calc(22px * var(--k));
      padding:var(--padY) var(--padX);
      background: rgba(255,255,255,.92);
      color:var(--ink);
      font-size:var(--ctrl);
      line-height:1.25;
      outline:none;
      -webkit-appearance:none;appearance:none;
      box-shadow: 0 10px 20px rgba(17,24,39,.06);
      transition: box-shadow .15s ease, border-color .15s ease;
    }
    input:focus,select:focus,textarea:focus{
      border-color: rgba(236,72,153,.35);
      box-shadow: var(--ring), 0 16px 30px rgba(17,24,39,.08);
    }

    .amount{font-weight:900;letter-spacing:.2px;}

    /* ✅ スクロールの主犯：textarea。固定高さ＆resize禁止で溢れにくくする */
    textarea{
      height: calc(76px * var(--k));  /* ←ここで調整。まだ溢れるなら 72→68 */
      resize:none;
      overflow:auto;
    }

    /* ✅ ボタン：黒→かわいいピンク寄りに（pomを邪魔しにくい） */
    .btn{
      width:100%;
      border:none;border-radius: calc(24px * var(--k));
      padding: calc(16px * var(--k)) calc(14px * var(--k));
      background: linear-gradient(135deg, rgba(236,72,153,.92), rgba(167,139,250,.92));
      color:var(--btnText);
      font-weight:900;
      font-size: calc(22px * var(--k));
      box-shadow: var(--shadowPop);
      cursor:pointer;
      margin-top: calc(2px * var(--k));
      transition: transform .06s ease, filter .15s ease;
      position:relative;
      z-index:2;
    }
    .btn:active{
      transform: translateY(1px) scale(.99);
      filter: brightness(1.04);
    }

    .hint{
      font-size: calc(14px * var(--k));
      color:var(--muted);
      line-height:1.35;
      margin-top: calc(6px * var(--k));
      padding-left: 2px;
    }

    .toastWrap{
      position:fixed; inset:0; pointer-events:none;
      display:flex;align-items:center;justify-content:center;
      z-index:999;
    }
    .toast{
      pointer-events:none;
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(229,231,235,.9);
      border-radius: calc(28px * var(--k));
      box-shadow: 0 22px 60px rgba(17,24,39,.28);
      padding: calc(16px * var(--k)) calc(16px * var(--k));
      display:grid;
      grid-template-columns: calc(108px * var(--k)) 1fr;
      gap: calc(12px * var(--k));
      align-items:center;
      opacity:0;
      transform: translateY(14px) scale(.98);
      transition: .18s ease;
      width:min(calc(420px * var(--k)), 92vw);
      backdrop-filter: blur(12px);
    }
    .toast.show{opacity:1;transform: translateY(0) scale(1);}
    .toast img{
      width: calc(108px * var(--k));
      height: calc(108px * var(--k));
      object-fit:contain;
      filter: drop-shadow(0 10px 14px rgba(17,24,39,.22));
    }
    .toast .t1{font-weight:900;font-size: calc(22px * var(--k));margin:0;}
    .toast .t2{color:#6b7280;font-size: calc(14px * var(--k));margin:4px 0 0;line-height:1.35;}
  </style>
</head>

<body>
  <div class="page">
    <div>
      <div class="title">家計入力</div>
      <div class="subtitle">金額 / カテゴリ / 支払方法 / メモ / 日付（任意）</div>
    </div>

    <div class="card">
      <form id="f">
        <div>
          <label for="amount">金額（必須）</label>
          <input id="amount" class="amount" name="amount" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="例：1200" required />
        </div>

        <div>
          <label for="category">カテゴリ（必須）</label>
          <select id="category" name="category" required>
            <option value="">読み込み中…</option>
          </select>
        </div>

        <div>
          <label for="method">支払方法（必須）</label>
          <select id="method" name="method" required>
            <option value="">読み込み中…</option>
          </select>
        </div>

        <div>
          <label for="memo">メモ（任意）</label>
          <textarea id="memo" name="memo" placeholder="例：コンビニ / ランチ / etc"></textarea>
        </div>

        <div>
          <label for="date">日付（任意）</label>
          <input id="date" name="date" type="date" />
        </div>

        <button class="btn" type="submit">追記する</button>

        <div class="hint">
          ・日付を空にすると「今日」で登録<br/>
          ・カテゴリは「変動費・特別費のみ」表示（固定費は除外）
        </div>
      </form>
    </div>
  </div>

  <div class="toastWrap">
    <div class="toast" id="toast">
      <img id="kuromiImg" alt="Kuromi">
      <div>
        <p class="t1">入力完了！</p>
        <p class="t2">追記しました</p>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycby31bFD85uYThxMWBEOptm7OU1ucc4EmZssDbO2Kbm_nUNemLpDgS_dhEZ-7cyCNDzN/exec";

    // ✅ ここをあなたの“新しいポム画像URL”に置き換える
    // 例： "https://lh3.googleusercontent.com/d/FILE_ID"
    const POM_OVERRIDE_URL = "https://www.sanrio.co.jp/wp-content/uploads/2022/06/list-pompompurin.png"; // ←ここに貼る（空ならGASのpomUrls[0]を使う）

    function jsonp(url) {
      return new Promise((resolve, reject) => {
        const cb = "cb_" + Math.random().toString(36).slice(2);
        window[cb] = (data) => { resolve(data); cleanup(); };
        const s = document.createElement("script");
        s.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cb;
        s.onerror = () => { reject(new Error("JSONP failed")); cleanup(); };
        document.head.appendChild(s);
        function cleanup(){
          try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
          s.remove();
        }
      });
    }

    function setSelectOptions(sel, items, placeholder){
      sel.innerHTML = "";
      const op0 = document.createElement("option");
      op0.value = "";
      op0.textContent = placeholder;
      sel.appendChild(op0);
      for (const v of items){
        const op = document.createElement("option");
        op.value = v;
        op.textContent = v;
        sel.appendChild(op);
      }
    }

    function pickFirstReachable(urls, imgEl){
      let i = 0;
      imgEl.onerror = () => {
        i++;
        if (i < urls.length) imgEl.src = urls[i];
      };
      imgEl.src = urls[0];
    }

    function setPom(url){
      document.body.classList.add("hasPom");
      document.body.style.setProperty("--pomBg", `url("${url}")`);
    }

    (async () => {
      const data = await jsonp(GAS_URL + "?action=master");
      setSelectOptions(document.getElementById("category"), data.categories, "カテゴリを選択");
      setSelectOptions(document.getElementById("method"), data.methods, "支払方法を選択");

      // ✅ pom：上書きURLがあればそれを最優先
      if (POM_OVERRIDE_URL && POM_OVERRIDE_URL.trim()){
        setPom(POM_OVERRIDE_URL.trim());
      } else if (data.pomUrls && data.pomUrls.length){
        setPom(data.pomUrls[0]);
      }

      window.__kuromiUrls = data.kuromiUrls || [];
      if (window.__kuromiUrls.length){
        pickFirstReachable(window.__kuromiUrls, document.getElementById("kuromiImg"));
      }
    })();

    const toast = document.getElementById("toast");
    function showToast(){
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }

    document.getElementById("f").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const fd = new FormData(ev.target);

      const a = (fd.get("amount") || "").toString().replace(/[^\d]/g, "");
      fd.set("amount", a);

      const res = await fetch(GAS_URL, { method:"POST", body: fd });
      const js = await res.json();
      if (!js.ok){
        alert(js.error || "エラー");
        return;
      }

      showToast();
      ev.target.reset();
    });
  </script>
</body>
</html>
