<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>名和家の家計簿！</title>
  <style>
    :root{
      --ink: #444; --muted: #888;
      --bg-pink: #fff0f5; --bg-purple: #f3f0ff; --accent-pink: #ff7eb3;
      --card-bg: rgba(255, 255, 255, 0.85); --border-thick: 2.5px;
      --stamp-size: 86px;
    }
    html,body{
      margin:0; padding:0; background: linear-gradient(135deg, var(--bg-pink) 0%, var(--bg-purple) 100%);
      background-attachment: fixed; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100%; overflow: hidden; color: var(--ink);
    }
    *{ box-sizing: border-box; touch-action: manipulation; }

    /* 変更点: タブバーに被らないよう padding-bottom を 80px に増やしました */
    .page { max-width: 500px; margin: 0 auto; padding: 10px 10px 80px 10px; height: 100svh; overflow-y: auto; overflow-x: hidden; position: relative; z-index: 1; }

    .header { position: relative; margin-bottom: 8px; min-height: 105px; padding: 10px 5px 0; }
    .title-group { position: relative; z-index: 2; padding-right: 100px; }
    .title-main { font-size: 24px; font-weight: 900; margin: 0; color: #555; }
    .title-sub { font-size: 12px; color: var(--muted); margin: 6px 0 0 0; font-weight: 600; line-height: 1.4; }
    .top-icon { position: absolute; right: 5px; top: 0px; width: 110px; height: 110px; object-fit: contain; opacity: 0.35; z-index: 0; pointer-events: none; }

    .budget-card {
      position: relative; z-index: 2; background: #fff; border-radius: 20px; padding: 16px;
      margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: var(--border-thick) solid #fff;
    }
    .budget-info { display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; color: var(--accent-pink); }
    .budget-bar-bg { height: 12px; background: #f5f5f5; border-radius: 6px; overflow: hidden; margin-top: 8px; }
    .budget-bar-fill { height: 100%; background: linear-gradient(90deg, #34d399, #10b981); width: 0%; transition: width 1s ease; }
    .budget-sub { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; font-weight: bold; color: var(--muted); }
    .budget-sub b { color: #10b981; font-size: 14px; }
    .budget-sub.over b { color: var(--accent-pink); }

    .card { background: var(--card-bg); border-radius: 24px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); border: var(--border-thick) solid #fff; backdrop-filter: blur(5px); }
    label { font-size: 10.5px; color: var(--muted); display: block; margin-bottom: 4px; font-weight: bold; padding-left: 4px; white-space: nowrap; }

    .amount-wrapper { position: relative; display: flex; align-items: center; margin-bottom: 12px; }
    .currency { position: absolute; left: 15px; font-weight: 900; font-size: 24px; color: var(--accent-pink); }
    input[name="amount"] { padding-left: 45px !important; font-size: 28px !important; font-weight: 900; color: var(--accent-pink); border: 2px solid #ffe0ec !important; background: #fff !important; border-radius: 16px; }

    input, select { width: 100%; border: 1.5px solid #eee; border-radius: 14px; padding: 0 12px; height: 46px; font-size: 15px; outline: none; margin-bottom: 12px; background: #fff; }

    /* 分類ボタン群（2行） */
    .cat-grid { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .cat-row { display: flex; gap: 6px; }
    .cat-chip { flex: 1 1 auto; min-width: 0; margin: 0; padding: 0; font-size: inherit; cursor: pointer; }
    .cat-chip input { position: absolute; opacity: 0; width: 0; height: 0; margin: 0; padding: 0; pointer-events: none; }
    .cat-chip span { display: block; text-align: center; white-space: nowrap; padding: 9px 6px; border-radius: 999px; background: #fff; border: 1.5px solid #eee; font-size: 12.5px; font-weight: bold; color: #666; transition: .15s; }
    .cat-chip input:checked + span { background: var(--accent-pink); border-color: var(--accent-pink); color: #fff; }
    @media (max-width: 360px) {
      .cat-row { gap: 4px; }
      .cat-chip span { padding: 9px 3px; font-size: 12px; }
    }
    .cat-chip.flash span { animation: flash .6s ease; }
    @keyframes flash { 0%{ transform: scale(1); } 40%{ transform: scale(1.12); } 100%{ transform: scale(1); } }

    /* 自由記入欄の予測候補 */
    .memo-wrap { position: relative; }
    .ac-list { display: none; position: absolute; left: 0; right: 0; top: 50px; z-index: 20; background: #fff; border: 1.5px solid #ffe0ec; border-radius: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); overflow: hidden; }
    .ac-list.show { display: block; }
    .ac-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 14px; font-size: 14px; font-weight: bold; color: #555; cursor: pointer; }
    .ac-item + .ac-item { border-top: 1px solid #fff0f5; }
    .ac-item:active { background: #fff0f5; }
    .ac-item small { flex: 0 0 auto; font-size: 11px; color: var(--muted); }

    .row-flex { display: flex; gap: 12px; align-items: flex-end; margin-top: 2px; }
    .date-box { flex: 1; min-width: 0; }
    .date-quick { display: flex; gap: 8px; margin-bottom: 8px; }
    .date-quick button { flex: 1; min-width: 0; height: 38px; border-radius: 12px; border: 1.5px solid #eee; background: #fff; color: #777; font-size: 13px; font-weight: bold; cursor: pointer; }
    .date-quick button.on { background: #ffe0ec; border-color: #ffc6dc; color: var(--accent-pink); }
    /* iOS の日付欄は width を無視するので見た目をリセットして横幅を揃える */
    input[type="date"].date-input { -webkit-appearance: none; appearance: none; display: block; width: 100%; min-width: 0; height: 38px; margin: 0; border-radius: 12px; border-color: #eee; font-size: 14px; text-align: left; background: #fff; color: var(--ink); }
    input[type="date"].date-input::-webkit-date-and-time-value { text-align: left; }

    .btn-group { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; }
    .stamp-btn {
      width: var(--stamp-size); height: var(--stamp-size); border-radius: 22px;
      border: 3px solid #fff; background: linear-gradient(135deg, #ffbdc0, #fecfef);
      box-shadow: 0 5px 0px rgba(255, 126, 179, 0.2); cursor: pointer; position: relative;
      display: flex; align-items: center; justify-content: center; transition: all 0.1s; padding: 0; overflow: hidden;
    }
    .btn-inner-label { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 100%; text-align: center; font-size: 10px; font-weight: 900; color: #fff; opacity: 0.65; z-index: 2; pointer-events: none; text-shadow: 0 0 4px rgba(0,0,0,0.2); }
    .stamp-btn img { width: 90%; height: 90%; object-fit: contain; position: relative; z-index: 1; margin-top: 4px; }
    .stamp-btn:active { transform: translateY(3px); box-shadow: 0 2px 0px rgba(255, 126, 179, 0.2); }

    .history-item { background: rgba(255, 255, 255, 0.7); border-radius: 18px; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border: 1.5px solid #fff; }
    .history-item.pending { border-style: dashed; border-color: #ffc6dc; }
    .history-item.tappable { cursor: pointer; transition: background .15s; }
    .history-item.tappable:active { background: #fff; }
    .section-title { font-size: 13px; font-weight: bold; color: var(--muted); margin-bottom: 10px; padding-left: 10px; }
    .section-title small { font-size: 10.5px; font-weight: bold; color: #b8a8b8; margin-left: 4px; }
    .h-memo { font-weight: bold; font-size: 14px; }
    .h-sub { font-size: 10px; color: var(--muted); }
    .h-state { font-size: 10px; font-weight: bold; color: var(--accent-pink); }
    .del-btn { color: #fff; border: none; background: #ffb5d2; border-radius: 10px; width: 32px; height: 32px; font-weight: bold; cursor: pointer; }

    /* 未送信・通信状態 */
    .sync-bar { display: none; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 12px; padding: 10px 14px; border-radius: 16px; background: #fff; border: 1.5px dashed #ffc6dc; font-size: 12px; font-weight: bold; color: #777; }
    .sync-bar.show { display: flex; }
    .sync-bar button { flex: 0 0 auto; border: none; background: var(--accent-pink); color: #fff; border-radius: 10px; padding: 6px 12px; font-size: 12px; font-weight: bold; cursor: pointer; }
    .empty-msg { text-align: center; font-size: 12px; color: var(--muted); padding: 16px 0; }
    .more-btn { display: block; width: 100%; height: 42px; margin-top: 4px; border-radius: 16px; border: 1.5px solid #fff; background: rgba(255, 255, 255, 0.7); color: var(--accent-pink); font-size: 13px; font-weight: bold; cursor: pointer; }
    .more-btn[hidden] { display: none; }

    /* 記録の修正パネル（下から出るシート） */
    .sheet-backdrop { position: fixed; inset: 0; background: rgba(70, 50, 70, 0.35); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 1100; }
    .sheet-backdrop.show { opacity: 1; pointer-events: auto; }
    .sheet { position: fixed; left: 50%; bottom: 0; width: 100%; max-width: 500px; max-height: 92svh; overflow-y: auto; transform: translate(-50%, 105%); transition: transform .3s ease; z-index: 1101; visibility: hidden;
      background: linear-gradient(135deg, var(--bg-pink) 0%, var(--bg-purple) 100%); border-radius: 26px 26px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 30px rgba(0,0,0,0.08); }
    .sheet.show { transform: translate(-50%, 0); visibility: visible; }
    .sheet-grip { width: 42px; height: 5px; border-radius: 3px; background: #e8d6e2; margin: 0 auto 10px; }
    .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .sheet-title { font-size: 17px; font-weight: 900; color: #555; }
    .sheet-close { border: none; background: #fff; width: 34px; height: 34px; border-radius: 12px; font-size: 16px; font-weight: bold; color: #aaa; cursor: pointer; }
    .sheet .card { padding: 16px; }
    .sheet-actions { display: flex; gap: 10px; margin-top: 14px; }
    .sheet-del { flex: 0 0 auto; height: 48px; padding: 0 18px; border-radius: 16px; border: 1.5px solid #ffc6dc; background: #fff; color: var(--accent-pink); font-size: 14px; font-weight: bold; cursor: pointer; }
    .sheet-save { flex: 1; height: 48px; border-radius: 16px; border: none; background: linear-gradient(135deg, #ff9ac4, var(--accent-pink)); color: #fff; font-size: 15px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 0 rgba(255, 126, 179, 0.25); }
    .sheet-save:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(255, 126, 179, 0.25); }
    .sheet-save:disabled, .sheet-del:disabled { opacity: .6; }

    .toastWrap { position: fixed; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; z-index: 1200; }
    .toast { background: #fff; border-radius: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); padding: 20px; display: flex; gap: 15px; align-items: center; opacity: 0; transform: translateY(20px); transition: .4s; border: 3px solid #ffdeeb; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast img { width: 70px; height: 70px; object-fit: contain; }

    /* ▼ 追加：タブ切り替えとダッシュボード用のCSS ▼ */
    .bottom-tab-bar {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 65px;
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
      border-top: var(--border-thick) solid #fff;
      display: flex; justify-content: center; align-items: center;
      z-index: 1000; padding-bottom: env(safe-area-inset-bottom);
    }
    .tab-container { width: 100%; max-width: 500px; display: flex; justify-content: space-around; }
    .tab-item { flex: 1; text-align: center; color: var(--muted); font-size: 11px; font-weight: bold; padding: 8px 0; cursor: pointer; transition: 0.2s; }
    .tab-item.active { color: var(--accent-pink); }
    .tab-icon { font-size: 22px; display: block; margin-bottom: 4px; }

    #view-input { display: block; height: 100%; }
    /* 分析は裏で先に読み込むため、使わない間は画面の外に置く（display:none や visibility:hidden だと幅が崩れる） */
    #view-dashboard { position: absolute; left: -20000px; top: 0; width: 100vw; max-width: 500px; height: 100%; margin: 0 auto; padding-bottom: 65px; pointer-events: none; }
    #view-dashboard.show { position: relative; left: auto; width: auto; pointer-events: auto; }
    #dashHost { position: relative; height: 100%; }
    #dashHost iframe { width: 100%; height: 100%; border: none; background: transparent; }
    .dash-loading { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font-size: 13px; font-weight: bold; color: var(--muted); }
    .dash-updating { display: none; position: absolute; right: 12px; top: 8px; z-index: 5; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,0.92); box-shadow: 0 2px 8px rgba(0,0,0,0.08); font-size: 11px; font-weight: bold; color: var(--accent-pink); pointer-events: none; }
  </style>
</head>
<body>

  <div id="view-input">
    <div class="page">
      <div class="header">
        <div class="title-group">
          <h1 class="title-main">名和家の家計簿！</h1>
          <p class="title-sub" id="randomMsg">読み込み中...</p>
        </div>
        <img src="icon_trans.png" class="top-icon" onerror="this.style.display='none'">
      </div>

      <div class="budget-card">
        <div class="budget-info">
          <span>実績 / 予算</span>
          <span>¥<span id="cur">0</span> / <span id="lim">0</span></span>
        </div>
        <div class="budget-bar-bg"><div class="budget-bar-fill" id="bar"></div></div>
        <div class="budget-sub" id="budgetSub"></div>
      </div>

      <div class="sync-bar" id="syncBar"><span id="syncMsg"></span><button type="button" id="syncBtn">再送する</button></div>

      <div class="card">
        <form id="f">
          <label>金額</label>
          <div class="amount-wrapper"><span class="currency">¥</span><input name="amount" type="tel" inputmode="numeric" placeholder="0" required></div>

          <label>分類（食費等）</label>
          <div class="cat-grid" id="category"></div>

          <label>カテゴリ（自由記入欄）</label>
          <div class="memo-wrap">
            <input name="memo" id="memo" placeholder="例：アオキ、ツルハ、鬼がらし" autocomplete="off">
            <div class="ac-list" id="acList"></div>
          </div>

          <div class="row-flex">
            <div class="date-box">
              <label>日付（空欄は今日扱い）</label>
              <div class="date-quick" data-target="date"><button type="button" data-days="0">今日</button><button type="button" data-days="1">昨日</button></div>
              <input name="date" id="date" type="date" class="date-input">
            </div>
            <div class="btn-group">
              <button class="stamp-btn" type="submit" id="subBtn">
                <span class="btn-inner-label">記録する！</span>
                <img src="stamp.png" onerror="this.src='https://img.icons8.com/bubbles/100/000000/todo-list.png'">
              </button>
            </div>
          </div>
        </form>
      </div>

      <div style="margin-top:20px; padding-bottom: 40px;">
        <div class="section-title">最近の記録<small>タップで修正できるよ</small></div>
        <div id="hList"></div>
        <button type="button" class="more-btn" id="moreBtn" hidden>さらに表示</button>
      </div>
    </div>
  </div>

  <div id="view-dashboard">
    <!-- 分析は入力画面が表示されたあとに裏で先に読み込み、記録を変えたときも裏で読み直す -->
    <div class="dash-updating" id="dashUpdating">最新に更新中…</div>
    <div id="dashHost"><div class="dash-loading" id="dashLoading">📊 分析を準備中…</div></div>
  </div>

  <div class="bottom-tab-bar">
    <div class="tab-container">
      <div class="tab-item active" id="tab-input" onclick="switchTab('input')">
        <span class="tab-icon">📝</span>
        入力する
      </div>
      <div class="tab-item" id="tab-dashboard" onclick="switchTab('dashboard')">
        <span class="tab-icon">📊</span>
        分析する
      </div>
    </div>
  </div>

  <!-- 記録の修正パネル -->
  <div class="sheet-backdrop" id="editBackdrop"></div>
  <div class="sheet" id="editSheet" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <div class="sheet-grip"></div>
    <div class="sheet-head"><span class="sheet-title" id="editTitle">記録を修正</span><button type="button" class="sheet-close" id="editClose" aria-label="閉じる">✕</button></div>
    <form id="ef" class="card" autocomplete="off">
      <label>金額</label>
      <div class="amount-wrapper"><span class="currency">¥</span><input name="amount" id="eAmount" type="tel" inputmode="numeric" placeholder="0" required></div>

      <label>分類（食費等）</label>
      <div class="cat-grid" id="eCategory"></div>

      <label>カテゴリ（自由記入欄）</label>
      <div class="memo-wrap">
        <input id="eMemo" placeholder="例：アオキ、ツルハ、鬼がらし" autocomplete="off">
        <div class="ac-list" id="eAcList"></div>
      </div>

      <label>日付</label>
      <div class="date-quick" data-target="eDate"><button type="button" data-days="0">今日</button><button type="button" data-days="1">昨日</button></div>
      <input id="eDate" type="date" class="date-input" required>

      <div class="sheet-actions">
        <button type="button" class="sheet-del" id="editDelete">削除</button>
        <button type="submit" class="sheet-save" id="editSave">保存する</button>
      </div>
    </form>
  </div>

  <div class="toastWrap"><div class="toast" id="tst"><img src="kuromi.png" onerror="this.src='https://img.icons8.com/bubbles/100/000000/heart-with-pulse.png'"><div><div id="tstTitle" style="font-weight:900; font-size:20px; color:var(--accent-pink);">登録完了！</div><div id="tstSub" style="font-size:12px; color:#a0a0b0;">家計簿を更新したよ♪</div></div></div></div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycby31bFD85uYThxMWBEOptm7OU1ucc4EmZssDbO2Kbm_nUNemLpDgS_dhEZ-7cyCNDzN/exec";
    const messages = ["登録作業、いつもありがとう！","体調は大丈夫？しっかり寝てね","今日も一日、お疲れ様！","無理しないで、ゆっくり休んでね","いつも家計を支えてくれて感謝！","美味しいもの食べてリラックス♪","少しずつ、理想の家計へ！","明日も素敵な一日になりますように","あなたの頑張り、見てるよ","今日も100点！自分を褒めてね"];

    // 端末に保存するキー
    const KEY_MASTER = "kakeibo.master.v1";   // 前回の action=master 応答
    const KEY_OUTBOX = "kakeibo.outbox.v1";   // 未送信の記録
    const KEY_MEMOS  = "kakeibo.memos.v2";    // 自由記入欄の候補（入力値→分類ごとの回数）
    const HISTORY_PAGE = 10;

    const $ = id => document.getElementById(id);
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const yen = n => Math.floor(Number(n) || 0).toLocaleString();

    function store(key, fallback) {
      try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
    }
    function save(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }

    function ymd(d) {
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }
    function newLocalId() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
    }

    let master = store(KEY_MASTER, null);
    let outbox = store(KEY_OUTBOX, []);
    let memoStats = store(KEY_MEMOS, { at: 0, memos: {} });
    let justSent = [];      // 送信済みだが、まだ最新の master に反映されていない記録
    let olderHistory = [];  // 「さらに表示」で追加読み込みした記録
    let historyEnd = false; // これ以上古い記録がない
    let loadingMore = false;
    let loadSeq = 0;
    let lastLoadAt = 0;
    let dashStale = false;    // 記録が変わって、分析を読み直す予定がある
    let dashLive = null;      // 表示できる状態の分析 iframe
    let dashPending = null;   // 裏で読み込み中の分析 iframe
    let dashLoadedAt = 0;
    let dashTimer = null;
    let dashPreloaded = false;

    // ---------- 通信 ----------

    // JSONP 1回分。タイムアウトしたら失敗扱いにし、遅れて届いた応答は捨てる
    function jsonpOnce(url, timeoutMs) {
      return new Promise((resolve, reject) => {
        const cb = "cb" + Date.now() + Math.floor(Math.random() * 1e6);
        const s = document.createElement("script");
        let done = false;
        const finish = () => { done = true; clearTimeout(timer); s.remove(); window[cb] = () => { delete window[cb]; }; };
        window[cb] = d => { if (done) return; finish(); delete window[cb]; resolve(d); };
        const timer = setTimeout(() => { if (done) return; finish(); reject(new Error("timeout")); }, timeoutMs);
        s.onerror = () => { if (done) return; finish(); reject(new Error("network")); };
        s.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cb;
        document.head.appendChild(s);
      });
    }

    async function jsonp(url, { timeout = 12000, retries = 2 } = {}) {
      for (let i = 0; ; i++) {
        try {
          const d = await jsonpOnce(url, timeout);
          if (d && d.error) throw new Error(d.error);
          return d;
        } catch (e) {
          if (i >= retries) throw e;
          await sleep(1000 * (i + 1));
        }
      }
    }

    async function post(fields, timeoutMs = 20000) {
      const fd = new FormData();
      Object.entries(fields).forEach(([k, v]) => fd.append(k, v ?? ""));
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        const res = await fetch(GAS_URL, { method: "POST", body: fd, keepalive: true, signal: ctrl.signal });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const text = await res.text();
        let j = null;
        try { j = JSON.parse(text); } catch (e) {}
        if (j && (j.ok === false || j.error)) throw new Error(j.error || "failed");
        return j;
      } finally {
        clearTimeout(timer);
      }
    }

    // ---------- 表示 ----------

    function renderBudget() {
      if (!master || !master.budget) return;
      const b = master.budget;
      $("cur").textContent = yen(b.total);
      $("lim").textContent = yen(b.limit);
      $("bar").style.width = Math.min(100, Number(b.percent) || 0) + "%";

      // 予算は月単位。今日を含めた当月の残り日数で割る
      const now = new Date();
      const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      const daysLeft = lastDay - now.getDate() + 1;
      const rest = Number(b.limit) - Number(b.total);
      const sub = $("budgetSub");
      sub.classList.toggle("over", rest < 0);
      sub.innerHTML = rest >= 0
        ? `<span>残り ${daysLeft}日</span><span>1日あたり <b>¥${yen(rest / daysLeft)}</b></span>`
        : `<span>残り ${daysLeft}日</span><span>予算オーバー <b>¥${yen(-rest)}</b></span>`;
    }

    // 分類ボタンは2行に分けて並べる（grid は入力欄なら "category"、修正パネルなら "eCategory"）
    function renderCategoryChips(grid, cats, current) {
      const chip = c => `<label class="cat-chip"><input type="radio" name="${grid}" value="${esc(c)}" ${c === current ? "checked" : ""}><span>${esc(c)}</span></label>`;
      const half = Math.ceil(cats.length / 2);
      $(grid).innerHTML = [cats.slice(0, half), cats.slice(half)]
        .filter(row => row.length)
        .map(row => `<div class="cat-row">${row.map(chip).join("")}</div>`).join("");
    }

    function renderCategories() {
      const cats = (master && master.categories) || [];
      if (!cats.length) return;
      const current = cats.includes(selectedCategory()) ? selectedCategory() : cats[0];
      renderCategoryChips("category", cats, current);
    }

    function selectedCategory(grid = "category") {
      const r = document.querySelector(`#${grid} input[name="${grid}"]:checked`);
      return r ? r.value : "";
    }

    function selectCategory(cat, flash, grid = "category") {
      const r = [...document.querySelectorAll(`#${grid} input[name="${grid}"]`)].find(x => x.value === cat);
      if (!r) return;
      r.checked = true;
      if (flash) {
        const chip = r.closest(".cat-chip");
        chip.classList.remove("flash"); void chip.offsetWidth; chip.classList.add("flash");
      }
    }

    function renderHistory() {
      // シートにある記録（IDあり）はタップで修正できる
      const itemHtml = (h, state) => {
        const editable = !state && h.id !== "" && h.id != null;
        return `
        <div class="history-item${state ? " pending" : ""}${editable ? " tappable" : ""}"${editable ? ` data-id="${esc(h.id)}"` : ""}>
          <div><div class="h-memo">${esc(h.memo || h.category)}</div><div class="h-sub">${esc(h.date)} · ${esc(h.category)}${state ? ` · <span class="h-state">${state}</span>` : ""}</div></div>
          <div style="display:flex; align-items:center; gap:10px;"><span style="font-weight:900; font-size:16px; color:var(--accent-pink);">¥${yen(h.amount)}</span>${editable ? `<button type="button" class="del-btn" data-del="${esc(h.id)}" aria-label="削除">×</button>` : ""}</div>
        </div>`;
      };
      const short = r => ({ ...r, date: r.date.slice(5).replace("-", "/") });
      const html = [
        ...outbox.map(r => itemHtml(short(r), r.failed ? "未送信" : "送信中…")),
        ...justSent.map(r => itemHtml(short(r), "登録済み")),
        ...serverHistory().map(h => itemHtml(h, ""))
      ].join("");
      $("hList").innerHTML = html || (master ? '<div class="empty-msg">まだ記録がないよ</div>' : "");
      $("moreBtn").hidden = !master || historyEnd || ((master.history || []).length < HISTORY_PAGE);
    }

    // 最新の記録＋追加読み込み分（登録や削除で位置がずれても同じ記録を二重に出さない）
    function serverHistory() {
      const seen = new Set();
      return [...((master && master.history) || []), ...olderHistory].filter(h => {
        const k = String(h.id);
        if (h.id !== "" && seen.has(k)) return false;
        seen.add(k);
        return true;
      });
    }

    async function loadMoreHistory() {
      if (loadingMore) return;
      loadingMore = true;
      const btn = $("moreBtn");
      btn.disabled = true;
      btn.textContent = "読み込み中…";
      try {
        const offset = serverHistory().length;
        const d = await jsonp(`${GAS_URL}?action=history&offset=${offset}&limit=${HISTORY_PAGE}`);
        const items = (d && d.history) || [];
        olderHistory.push(...items);
        if (items.length < HISTORY_PAGE) historyEnd = true;
      } catch (e) {
        alert("読み込みに失敗しました。もう一度押してね。");
      } finally {
        loadingMore = false;
        btn.disabled = false;
        btn.textContent = "さらに表示";
        renderHistory();
      }
    }
    $("moreBtn").addEventListener("click", loadMoreHistory);

    $("hList").addEventListener("click", e => {
      const delBtn = e.target.closest("[data-del]");
      if (delBtn) { del(delBtn.dataset.del); return; }
      const item = e.target.closest(".history-item[data-id]");
      if (item) openEditor(item.dataset.id);
    });

    function renderSync(loadError) {
      const failed = outbox.filter(r => r.failed).length;
      const bar = $("syncBar");
      if (failed) {
        $("syncMsg").textContent = `📮 未送信 ${failed}件（通信が戻ったら自動で送るね）`;
        $("syncBtn").textContent = "再送する";
        $("syncBtn").onclick = () => flush();
        bar.classList.add("show");
      } else if (loadError) {
        $("syncMsg").textContent = master ? "📶 通信できないので前回のデータを表示中" : "📶 読み込みに失敗しました";
        $("syncBtn").textContent = "再読み込み";
        $("syncBtn").onclick = () => load();
        bar.classList.add("show");
      } else {
        bar.classList.remove("show");
      }
    }

    function renderAll() {
      renderBudget();
      renderCategories();
      renderHistory();
      renderDateButtons();
    }

    // ---------- 読み込み ----------

    // keepOlder: 修正のように記録の並びが変わらない場合は、追加読み込み分を畳まない
    async function load({ keepOlder = false } = {}) {
      const seq = ++loadSeq;
      const startedAt = Date.now();
      try {
        const d = await jsonp(GAS_URL + "?action=master");
        if (seq !== loadSeq) return;
        master = d;
        save(KEY_MASTER, d);
        lastLoadAt = Date.now();
        justSent = justSent.filter(r => r.sentAt >= startedAt);
        // 最新分が入れ替わると追加分との境目がずれるので、追加分は畳んで最初の10件に戻す
        if (!keepOlder) {
          olderHistory = [];
          historyEnd = false;
        }
        renderAll();
        renderSync(false);
        loadMemoStats();
        // 入力画面が整ってから、分析を裏で先に読み込む（開いたときにすぐ見せるため）
        if (!dashPreloaded) { dashPreloaded = true; setTimeout(() => { if (!dashLive && !dashPending) refreshDash(); }, 1500); }
      } catch (e) {
        if (seq !== loadSeq) return;
        renderSync(true);
      }
    }

    // ---------- 自由記入欄の候補 ----------

    // サーバーから「入力値→分類ごとの回数」を取得（1時間に1回まで）
    async function loadMemoStats(force) {
      if (!force && Date.now() - (memoStats.at || 0) < 60 * 60 * 1000) return;
      try {
        const d = await jsonp(GAS_URL + "?action=memos", { timeout: 15000, retries: 1 });
        if (!d || !Array.isArray(d.memos)) return;
        const memos = {};
        d.memos.forEach(m => { if (m && m.m) memos[m.m] = m.cats || {}; });
        memoStats = { at: Date.now(), memos };
        save(KEY_MEMOS, memoStats);
      } catch (e) {}
    }

    function countMemo(memo, cat) {
      if (!memo) return;
      const cats = memoStats.memos[memo] || (memoStats.memos[memo] = {});
      cats[cat] = (cats[cat] || 0) + 1;
      save(KEY_MEMOS, memoStats);
    }

    // 今ある分類ボタンの中で、その入力値に最も多く使われた分類
    function topCategory(memo) {
      const cats = memoStats.memos[memo];
      const current = (master && master.categories) || [];
      if (!cats) return "";
      return Object.entries(cats).filter(([c]) => current.includes(c)).sort((a, b) => b[1] - a[1])[0]?.[0] || "";
    }

    // ひらがな・カタカナ・全角半角・大文字小文字の違いを無視して比べる
    const normalize = s => String(s).normalize("NFKC").toLowerCase()
      .replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));

    // 入力中の文字で始まるものを優先し、次に含むものを、よく使う順に最大6件
    function renderAutocomplete(input, list) {
      const q = normalize(input.value.trim());
      if (!q || document.activeElement !== input) { list.classList.remove("show"); return; }
      const scored = Object.entries(memoStats.memos).map(([m, cats]) => {
        const n = normalize(m);
        const rank = n.startsWith(q) ? 0 : n.includes(q) ? 1 : -1;
        return { m, rank, count: Object.values(cats).reduce((a, b) => a + b, 0) };
      }).filter(x => x.rank >= 0)
        .sort((a, b) => a.rank - b.rank || b.count - a.count)
        .slice(0, 6);
      list.innerHTML = scored.map(x => {
        const cat = topCategory(x.m);
        return `<div class="ac-item" data-memo="${esc(x.m)}"><span>${esc(x.m)}</span>${cat ? `<small>${esc(cat)}</small>` : ""}</div>`;
      }).join("");
      list.classList.toggle("show", scored.length > 0);
    }

    // 自由記入欄に予測候補をつける。候補を選ぶと、よく使う分類を grid で選ぶ
    function attachAutocomplete(input, list, grid) {
      const render = () => renderAutocomplete(input, list);
      input.addEventListener("input", render);
      input.addEventListener("compositionupdate", () => setTimeout(render, 0));
      input.addEventListener("focus", render);
      input.addEventListener("blur", () => setTimeout(() => list.classList.remove("show"), 150));
      // 候補をタップしても入力欄のフォーカスが外れないようにする
      list.addEventListener("pointerdown", e => e.preventDefault());
      list.addEventListener("click", e => {
        const item = e.target.closest(".ac-item");
        if (!item) return;
        const memo = item.dataset.memo;
        input.value = memo;
        const cat = topCategory(memo);
        if (cat) selectCategory(cat, true, grid);
        list.classList.remove("show");
        input.blur();
      });
    }
    attachAutocomplete($("memo"), $("acList"), "category");
    attachAutocomplete($("eMemo"), $("eAcList"), "eCategory");

    // ---------- 日付 ----------

    // 「今日」「昨日」ボタンの選択状態。入力欄の日付は空欄なら今日扱い
    function renderDateButtons() {
      const today = ymd(new Date());
      const y = new Date(); y.setDate(y.getDate() - 1);
      document.querySelectorAll(".date-quick").forEach(group => {
        const v = $(group.dataset.target).value || (group.dataset.target === "date" ? today : "");
        group.querySelectorAll("button").forEach(b => {
          b.classList.toggle("on", v === (b.dataset.days === "0" ? today : ymd(y)));
        });
      });
    }
    document.querySelectorAll(".date-quick").forEach(group => {
      group.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
        const d = new Date(); d.setDate(d.getDate() - Number(b.dataset.days));
        $(group.dataset.target).value = ymd(d);
        renderDateButtons();
      }));
      $(group.dataset.target).addEventListener("change", renderDateButtons);
    });

    // ---------- 登録（端末に保存してから非同期で送信） ----------

    $("f").addEventListener("submit", e => {
      e.preventDefault();
      const b = $("subBtn");
      b.disabled = true;
      setTimeout(() => { b.disabled = false; }, 400);

      const amount = $("f").amount.value.replace(/[^0-9]/g, "");
      if (!amount) return;
      const rec = {
        localId: newLocalId(),
        amount: Number(amount),
        category: selectedCategory(),
        memo: $("memo").value.trim(),
        // 後で再送されても日付がずれないよう、空欄なら記録した日の日付を入れておく
        date: $("date").value || ymd(new Date())
      };
      outbox.push(rec);
      save(KEY_OUTBOX, outbox);
      countMemo(rec.memo, rec.category);

      const cat = rec.category;
      e.target.reset();
      selectCategory(cat);
      $("acList").classList.remove("show");
      renderHistory();
      renderDateButtons();
      flush();
    });

    let flushing = false;
    async function flush() {
      if (flushing || !outbox.length) return;
      flushing = true;
      let sentAny = false;
      try {
        // 送信中に追加された記録も続けて送る
        while (outbox.length) {
          const rec = outbox[0];
          rec.failed = false;
          renderHistory();
          try {
            await post({ localId: rec.localId, amount: rec.amount, category: rec.category, method: "", memo: rec.memo, date: rec.date });
            outbox = outbox.filter(r => r.localId !== rec.localId);
            save(KEY_OUTBOX, outbox);
            justSent.unshift({ ...rec, sentAt: Date.now() });
            sentAny = true;
            showToast();
          } catch (err) {
            // 通信が不調なら残りは次の機会にまとめて送る
            outbox.forEach(r => { r.failed = true; });
            save(KEY_OUTBOX, outbox);
            break;
          }
        }
      } finally {
        flushing = false;
        renderHistory();
        renderSync(false);
      }
      if (sentAny) {
        scheduleDashRefresh();
        load();
      }
    }

    let toastTimer;
    function showToast(title = "登録完了！", sub = "家計簿を更新したよ♪") {
      $("tstTitle").textContent = title;
      $("tstSub").textContent = sub;
      const tst = $("tst");
      tst.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => tst.classList.remove("show"), 2500);
    }

    // ---------- 削除 ----------

    // 確認して削除する。消した場合は true
    async function del(id) {
      if (!confirm("この記録を消してもいい？")) return false;
      if (master && master.history) {
        master.history = master.history.filter(h => String(h.id) !== String(id));
        olderHistory = olderHistory.filter(h => String(h.id) !== String(id));
        renderHistory();
      }
      try {
        await post({ action: "delete", rowId: id });
        scheduleDashRefresh();
      } catch (e) {
        alert("削除に失敗しました。");
      }
      load();
      return true;
    }

    // ---------- 修正 ----------

    let editing = null;  // 修正中の記録

    // 古いキャッシュの記録は "MM/dd" しかないので年を補う（未来の月なら前年）
    function historyYmd(h) {
      if (h.ymd) return h.ymd;
      const m = /^(\d{2})\/(\d{2})$/.exec(h.date || "");
      if (!m) return ymd(new Date());
      const now = new Date();
      const year = Number(m[1]) > now.getMonth() + 1 ? now.getFullYear() - 1 : now.getFullYear();
      return `${year}-${m[1]}-${m[2]}`;
    }

    function openEditor(id) {
      const h = serverHistory().find(x => String(x.id) === String(id));
      if (!h) return;
      editing = h;
      // 今はない分類（旧名など）の記録も、そのまま保存できるように選択肢に加える
      const cats = [...((master && master.categories) || [])];
      if (h.category && !cats.includes(h.category)) cats.push(h.category);
      renderCategoryChips("eCategory", cats, h.category);
      $("eAmount").value = h.amount;
      $("eMemo").value = h.memo || "";
      $("eDate").value = historyYmd(h);
      renderDateButtons();
      $("editSave").disabled = false;
      $("editSave").textContent = "保存する";
      $("editBackdrop").classList.add("show");
      $("editSheet").classList.add("show");
    }

    function closeEditor() {
      editing = null;
      $("eAcList").classList.remove("show");
      $("editBackdrop").classList.remove("show");
      $("editSheet").classList.remove("show");
    }

    $("editClose").addEventListener("click", closeEditor);
    $("editBackdrop").addEventListener("click", closeEditor);
    document.addEventListener("keydown", e => { if (e.key === "Escape" && editing) closeEditor(); });

    $("editDelete").addEventListener("click", async () => {
      if (!editing) return;
      const id = editing.id;
      if (await del(id)) closeEditor();
    });

    $("ef").addEventListener("submit", async e => {
      e.preventDefault();
      if (!editing) return;
      const amount = $("eAmount").value.replace(/[^0-9]/g, "");
      const date = $("eDate").value;
      if (!amount || !date) return;
      const rec = { amount: Number(amount), category: selectedCategory("eCategory"), memo: $("eMemo").value.trim(), date };
      const btn = $("editSave");
      btn.disabled = true;
      btn.textContent = "保存中…";
      try {
        await post({ action: "update", rowId: editing.id, ...rec });
        // 画面上の記録をすぐ書き換え、裏で予算などを読み直す
        const patch = h => String(h.id) === String(editing.id)
          ? { ...h, ...rec, ymd: date, date: date.slice(5).replace("-", "/") } : h;
        if (master && master.history) master.history = master.history.map(patch);
        olderHistory = olderHistory.map(patch);
        countMemo(rec.memo, rec.category);
        renderHistory();
        closeEditor();
        showToast("修正完了！", "記録を直したよ♪");
        scheduleDashRefresh();
        load({ keepOlder: true });
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "保存する";
        alert("保存できませんでした。通信状態を確認して、もう一度試してね。");
      }
    });

    // ---------- タブ切り替え ----------

    // ---------- 分析タブ（裏で読み込んでおく） ----------

    function updateDashBadge() {
      // 表示中の分析があり、それが古くなる（または入れ替え待ち）ときだけ知らせる
      $("dashUpdating").style.display = (dashLive && (dashStale || dashPending)) ? "block" : "none";
    }

    // 新しい分析を見えない状態で読み込み、表示できる合図が来たら入れ替える（空白を見せない）
    function refreshDash() {
      clearTimeout(dashTimer);
      if (dashPending) { clearTimeout(dashPending._fallback); dashPending.remove(); }
      const f = document.createElement("iframe");
      f.title = "分析";
      f.style.cssText = "position:absolute; inset:0; visibility:hidden;";
      f.src = GAS_URL + "?v=" + Date.now();
      $("dashHost").appendChild(f);
      dashPending = f;
      dashStale = false;
      // 合図が届かなくても（古い版など）60秒後には切り替える
      f._fallback = setTimeout(() => { if (dashPending === f) swapDash(); }, 60000);
      updateDashBadge();
    }

    function swapDash() {
      const f = dashPending;
      if (!f) return;
      clearTimeout(f._fallback);
      if (dashLive) dashLive.remove();
      f.style.cssText = "";
      dashLive = f;
      dashPending = null;
      dashLoadedAt = Date.now();
      $("dashLoading").style.display = "none";
      updateDashBadge();
    }

    // 記録が変わったら、少し待ってまとめて読み直す
    function scheduleDashRefresh(delay = 3000) {
      dashStale = true;
      clearTimeout(dashTimer);
      dashTimer = setTimeout(refreshDash, delay);
      updateDashBadge();
    }

    window.addEventListener("message", e => {
      if (!e.data || e.data.type !== "kakeibo-dash-ready" || !dashPending) return;
      try {
        const h = new URL(e.origin).hostname;
        if (!(h === "script.google.com" || h.endsWith(".googleusercontent.com"))) return;
      } catch (err) { return; }
      swapDash();
    });

    window.switchTab = function(target) {
      if(target === 'input') {
        $('view-input').style.display = 'block';
        $('view-dashboard').classList.remove('show');
        $('tab-input').classList.add('active');
        $('tab-dashboard').classList.remove('active');
      } else {
        if (!dashLive && !dashPending) refreshDash();
        updateDashBadge();
        $('view-input').style.display = 'none';
        $('view-dashboard').classList.add('show');
        $('tab-input').classList.remove('active');
        $('tab-dashboard').classList.add('active');
      }
    };

    // ---------- 起動 ----------

    $("randomMsg").textContent = messages[Math.floor(Math.random() * messages.length)];
    outbox.forEach(r => { r.failed = true; });  // 前回送れなかった分
    renderAll();
    renderSync(false);
    load();
    flush();

    window.addEventListener("online", () => { flush(); load(); });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState !== "visible") return;
      flush();
      if (Date.now() - lastLoadAt > 60 * 1000) load();
      // 開きっぱなしで古くなった分析（他の端末での登録など）を裏で読み直す
      if (dashLive && !dashPending && Date.now() - dashLoadedAt > 5 * 60 * 1000) scheduleDashRefresh(1000);
      renderBudget();
      renderDateButtons();
    });
    setInterval(() => { if (outbox.some(r => r.failed)) flush(); }, 30 * 1000);
  </script>
</body>
</html>
