<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>名和家の家計簿！</title>
  <style>
    :root{ --ink:#111827; --muted:#6b7280; --bg:#f7f7fb; --pink:#ec4893; --btnColor:linear-gradient(135deg, rgba(236,72,153,.92), rgba(167,139,250,.92)); }
    html,body{ margin:0; padding:0; background: var(--bg); font-family: sans-serif; height: 100%; overflow: hidden; }
    *{ box-sizing: border-box; touch-action: manipulation; }

    /* 背景画像：icon-1024.png.png */
    #bg-layer {
      position: fixed; inset: 0; z-index: -1; opacity: 0.12;
      background-image: url('icons/icon-1024.png.png');
      background-repeat: no-repeat; background-position: center 25%;
      background-size: min(350px, 80vw); pointer-events: none;
    }

    .page { max-width: 500px; margin: 0 auto; padding: 12px; height: 100svh; overflow-y: auto; position: relative; z-index: 1; }
    .title-area { margin-bottom: 12px; }
    .title-main { font-size: 24px; font-weight: 900; margin: 0; }

    .budget-card { background: rgba(255,255,255,0.85); border-radius: 16px; padding: 12px; margin-bottom: 12px; backdrop-filter: blur(5px); }
    .budget-info { display: flex; justify-content: space-between; font-size: 13px; font-weight: bold; }
    .budget-bar-bg { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; margin-top: 8px; }
    .budget-bar-fill { height: 100%; background: #34d399; width: 0%; transition: width 0.8s ease; }

    .card { background: rgba(255,255,255,0.95); border-radius: 20px; padding: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; font-weight: bold; }
    
    /* 金額入力UI */
    .amount-wrapper { position: relative; display: flex; align-items: center; margin-bottom: 12px; }
    .currency { position: absolute; left: 14px; font-weight: 900; font-size: 22px; color: var(--pink); }
    input[name="amount"] { padding-left: 38px !important; font-size: 26px !important; font-weight: 900; color: var(--pink); border: 2px solid #fce7f3; }

    /* 全フィールド高さ統一 */
    input, select { width: 100%; border: 1px solid #e5e7eb; border-radius: 12px; padding: 12px; height: 48px; font-size: 16px; outline: none; margin-bottom: 12px; background: #fff; }
    input[type="date"] { appearance: none; -webkit-appearance: none; width: 100%; }

    .btn { width: 100%; border: none; border-radius: 14px; padding: 16px; height: 56px; background: var(--btnColor); color: #fff; font-weight: 900; font-size: 18px; cursor: pointer; }

    .history-item { background: rgba(255,255,255,0.7); border-radius: 12px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .del-btn { color: #f87171; border: none; background: #fee2e2; border-radius: 8px; width: 32px; height: 32px; font-weight: bold; cursor: pointer; }

    /* トースト通知：kuromi.png */
    .toastWrap { position: fixed; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; z-index: 999; }
    .toast { background: rgba(255,255,255,.95); border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,.2); padding: 20px; display: flex; gap: 16px; align-items: center; opacity: 0; transform: translateY(20px); transition: .3s; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast img { width: 60px; height: 60px; object-fit: contain; }
  </style>
</head>
<body>
  <div id="bg-layer"></div>
  <div class="page">
    <div class="title-area"><h1 class="title-main">名和家の家計簿！</h1></div>
    <div class="budget-card">
      <div class="budget-info"><span>実績 / 予算(30日換算)</span><span>¥<span id="cur">0</span> / ¥<span id="lim">0</span></span></div>
      <div class="budget-bar-bg"><div class="budget-bar-fill" id="bar"></div></div>
    </div>
    <div class="card">
      <form id="f">
        <label>金額</label>
        <div class="amount-wrapper"><span class="currency">¥</span><input name="amount" type="tel" inputmode="numeric" placeholder="0" required></div>
        <label>カテゴリ</label><select id="category" name="category" required></select>
        <label>支払方法</label><select id="method" name="method" required></select>
        <label>店名・メモ</label><input name="memo" placeholder="例：アオキ、ツルハ、鬼がらし">
        <label>日付</label><input name="date" type="date">
        <button class="btn" type="submit" id="subBtn">記録する</button>
      </form>
    </div>
    <div style="margin-top:20px; padding-bottom: 40px;"><div style="font-size:13px; font-weight:bold; color:var(--muted); margin-bottom:8px;">最近の記録</div><div id="hList"></div></div>
  </div>
  <div class="toastWrap"><div class="toast" id="tst"><img src="icons/kuromi.png" onerror="this.src='https://img.icons8.com/color/96/ok--v1.png'"><div><div style="font-weight:900; font-size:18px;">登録しました！</div><div style="font-size:12px; color:#666;">家計簿を更新しました♪</div></div></div></div>
  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycby31bFD85uYThxMWBEOptm7OU1ucc4EmZssDbO2Kbm_nUNemLpDgS_dhEZ-7cyCNDzN/exec";
    async function load() {
      const d = await jsonp(GAS_URL + "?action=master");
      document.getElementById("cur").textContent = Math.floor(d.budget.total).toLocaleString();
      document.getElementById("lim").textContent = Math.floor(d.budget.limit).toLocaleString();
      document.getElementById("bar").style.width = d.budget.percent + "%";
      const f = (i, l) => { document.getElementById(i).innerHTML = l.map(v => `<option value="${v}">${v}</option>`).join(''); };
      f("category", d.categories); f("method", d.methods);
      document.getElementById("hList").innerHTML = d.history.map(h => `
        <div class="history-item">
          <div><div style="font-weight:bold;">${h.memo || h.category}</div><div style="font-size:11px; color:#999;">${h.date} · ${h.category}</div></div>
          <div style="display:flex; align-items:center; gap:10px;"><span style="font-weight:900;">¥${h.amount.toLocaleString()}</span><button class="del-btn" onclick="del('${h.id}')">×</button></div>
        </div>`).join('');
    }
    window.del = async (id) => { if(!confirm("削除しますか？")) return; await fetch(GAS_URL + "&action=delete&rowId=" + id, { method: "POST" }); load(); };
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault(); const b = document.getElementById("subBtn"); b.disabled = true;
      const fd = new FormData(e.target); fd.set("amount", fd.get("amount").replace(/[^0-9]/g, ""));
      document.getElementById("tst").classList.add("show");
      await fetch(GAS_URL, { method: "POST", body: fd, keepalive: true });
      setTimeout(() => document.getElementById("tst").classList.remove("show"), 2500);
      e.target.reset(); load(); b.disabled = false;
    });
    function jsonp(u) { return new Promise(r => { const c = "cb" + Date.now(); window[c] = d => { r(d); delete window[c]; s.remove(); }; const s = document.createElement("script"); s.src = `${u}&callback=${c}`; document.head.appendChild(s); }); }
    load();
  </script>
</body>
</html>
