<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>名和家の家計簿！</title>

  <style>
    :root{
      --ink:#111827; --muted:#6b7280; --bg:#f7f7fb;
      --pink: #ec4893;
      --btnColor: linear-gradient(135deg, rgba(236,72,153,.92), rgba(167,139,250,.92));
    }

    html,body{ margin:0; padding:0; background: var(--bg); font-family: sans-serif; height: 100%; overflow: hidden; }
    *{ box-sizing: border-box; touch-action: manipulation; }

    /* ② 画像表示の修正（より確実な方法） */
    body::after {
      content: "";
      position: fixed; inset: 0; z-index: -1;
      opacity: 0.15;
      background-image: url('icons/Gemini_Generated_Image_va05a4va05a4va05_transparent.png');
      background-repeat: no-repeat;
      background-position: center 25%;
      background-size: min(320px, 80vw);
      pointer-events: none;
    }

    .page { max-width: 500px; margin: 0 auto; padding: 12px; height: 100svh; overflow-y: auto; position: relative; z-index: 1; }
    
    .title-area { margin-bottom: 12px; text-align: left; }
    .title-main { font-size: 22px; font-weight: 900; margin: 0; }

    .budget-card {
      background: rgba(255,255,255,0.85); border-radius: 16px; padding: 12px;
      margin-bottom: 12px; backdrop-filter: blur(5px);
    }
    .budget-info { display: flex; justify-content: space-between; font-size: 13px; font-weight: bold; }
    .budget-bar-bg { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; margin-top: 8px; }
    .budget-bar-fill { height: 100%; background: #34d399; width: 0%; transition: width 0.8s ease; }

    .card { background: rgba(255,255,255,0.95); border-radius: 20px; padding: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    
    label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; font-weight: bold; }
    
    .amount-input-wrapper { position: relative; display: flex; align-items: center; margin-bottom: 12px; }
    .currency-symbol { position: absolute; left: 14px; font-weight: 900; font-size: 22px; color: var(--pink); }
    input[name="amount"] { padding-left: 38px !important; font-size: 26px !important; font-weight: 900; color: var(--pink); border: 2px solid #fce7f3; }

    /* ③ 入力フィールドの高さ統一 */
    input, select, textarea {
      width: 100%; border: 1px solid #e5e7eb; border-radius: 12px; 
      padding: 12px; height: 48px; /* 高さを48pxに固定 */
      font-size: 16px; outline: none; margin-bottom: 12px; background: #fff;
    }
    textarea { height: 60px; } /* メモだけは少し高く */

    /* ③ 日付欄の特別調整（ブラウザ標準のデザインを抑制） */
    input[type="date"] {
        display: flex;
        align-items: center;
        appearance: none; -webkit-appearance: none;
    }

    .btn {
      width: 100%; border: none; border-radius: 14px; padding: 16px; height: 56px;
      background: var(--btnColor); color: #fff; font-weight: 900; font-size: 18px;
    }

    .history-item {
      background: rgba(255,255,255,0.7); border-radius: 12px; padding: 10px 14px;
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    }
    .h-cat { font-size: 11px; color: #999; }
    .h-memo { font-weight: bold; font-size: 15px; }
  </style>
</head>

<body>
  <div class="page">
    <div class="title-area">
      <h1 class="title-main">名和家の家計簿！</h1>
    </div>

    <div class="budget-card" id="budgetCard">
      <div class="budget-info">
        <span>今月の実績/予算</span>
        <span>¥<span id="currentTotal">0</span> / ¥<span id="budgetLimit">0</span></span>
      </div>
      <div class="budget-bar-bg"><div class="budget-bar-fill" id="budgetBar"></div></div>
    </div>

    <div class="card">
      <form id="f">
        <label>金額</label>
        <div class="amount-input-wrapper">
          <span class="currency-symbol">¥</span>
          <input name="amount" type="tel" inputmode="numeric" placeholder="0" required>
        </div>

        <label>カテゴリ</label>
        <select id="category" name="category" required></select>

        <label>支払方法</label>
        <select id="method" name="method" required></select>

        <label>店名・メモ（任意）</label>
        <input name="memo" placeholder="例：アオキ、ツルハ、鬼がらし">

        <label>日付（空欄なら今日）</label>
        <input name="date" type="date">

        <button class="btn" type="submit" id="submitBtn">記録する</button>
      </form>
    </div>

    <div style="margin-top:20px; padding-bottom: 40px;">
      <div style="font-size:13px; font-weight:bold; color:var(--muted); margin-bottom:8px;">最近の記録</div>
      <div id="historyList"></div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycby31bFD85uYThxMWBEOptm7OU1ucc4EmZssDbO2Kbm_nUNemLpDgS_dhEZ-7cyCNDzN/exec";

    async function loadData() {
        const data = await jsonp(GAS_URL + "?action=master");
        
        // ① 実績 / 予算 の順で表示
        document.getElementById("currentTotal").textContent = Math.floor(data.budget.total).toLocaleString();
        document.getElementById("budgetLimit").textContent = Math.floor(data.budget.limit).toLocaleString();
        document.getElementById("budgetBar").style.width = data.budget.percent + "%";

        const fill = (id, list) => {
          const el = document.getElementById(id);
          el.innerHTML = list.map(v => `<option value="${v}">${v}</option>`).join('');
        };
        fill("category", data.categories);
        fill("method", data.methods);

        document.getElementById("historyList").innerHTML = data.history.map(h => `
          <div class="history-item">
            <div>
              <div class="h-memo">${h.memo || h.category}</div>
              <div class="h-cat">${h.date} · ${h.category}</div>
            </div>
            <span style="font-weight:900; font-size:16px;">¥${Math.floor(h.amount).toLocaleString()}</span>
          </div>
        `).join('');
    }

    document.getElementById("f").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      const fd = new FormData(ev.target);
      const amt = fd.get("amount").replace(/[^0-9]/g, "");
      fd.set("amount", amt);
      await fetch(GAS_URL, { method: "POST", body: fd, keepalive: true });
      ev.target.reset();
      loadData();
      btn.disabled = false;
    });

    function jsonp(url) {
      return new Promise(res => {
        const cb = "cb" + Date.now();
        window[cb] = d => { res(d); delete window[cb]; s.remove(); };
        const s = document.createElement("script");
        s.src = `${url}&callback=${cb}`;
        document.head.appendChild(s);
      });
    }
    loadData();
  </script>
</body>
</html>
