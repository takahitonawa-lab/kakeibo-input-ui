<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
  <title>名和家の家計簿！</title>

<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    :root{
      --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --bg:#f7f7fb; --btnText:#fff;
      --k: .9;
      --radius: calc(18px * var(--k));
      --btnColor: linear-gradient(135deg, rgba(236,72,153,.92), rgba(167,139,250,.92));
      
      /* シャドウ系 */
      --shadowSoft: 0 14px 30px rgba(17, 24, 39, .10);
      --shadowPop:  0 18px 45px rgba(17, 24, 39, .18);
    }

    html,body{
      margin:0;padding:0;
      color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background: var(--bg);
      overflow:hidden;
      height: 100%;
    }
    *{ touch-action: manipulation; box-sizing:border-box; }

    /* 背景 */
    body::before{
      content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
      background:
        radial-gradient(1200px 600px at 15% 8%, rgba(236,72,153,.18), transparent 60%),
        radial-gradient(900px 500px at 90% 15%, rgba(56,189,248,.20), transparent 55%),
        transparent;
    }

    /* ポム画像 */
    body.hasPom::after{
      content:""; position:fixed; inset:0; pointer-events:none; opacity:.25;
      background-repeat:no-repeat; background-position:right 10px top 10px;
      background-size: min(250px, 34vw);
      background-image: var(--pomBg);
      z-index:3;
    }

    .page{
      max-width: 760px; margin:0 auto; height: 100svh;
      padding: 12px; display:flex; flex-direction:column; gap: 10px;
      position:relative; z-index:1; overflow-y: auto;
    }

    .header-row {
        display: flex; justify-content: space-between; align-items: center;
        margin: 6px 0 8px;
    }
    .title{ font-size:28px; font-weight:900; letter-spacing:.2px; margin:0;}
    .subtitle{ font-size:14px; color:var(--muted); margin:0;}
    
    /* 更新ボタン */
    .refresh-btn {
        background: rgba(255,255,255,0.6); border: 1px solid rgba(0,0,0,0.1);
        border-radius: 50%; width: 32px; height: 32px;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; color: var(--muted);
    }
    .refresh-btn svg { width: 18px; height: 18px; fill: currentColor; transition: transform 0.5s;}
    .refresh-btn:active svg { transform: rotate(180deg); }

    .card{
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(229,231,235,.85);
      border-radius: 24px;
      padding: 16px;
      box-shadow: var(--shadowSoft);
      backdrop-filter: blur(10px);
    }

    form{display:flex;flex-direction:column;gap:12px;}
    label{ font-size:14px; color:var(--muted); margin-bottom:4px; display:block;}
    
    input,select,textarea{
      width:100%; max-width: 100%;
      border:1px solid rgba(229,231,235,.95);
      border-radius: 18px; padding: 14px;
      background: rgba(255,255,255,.92);
      font-size:18px; outline:none;
      box-shadow: 0 4px 10px rgba(0,0,0,.03);
    }
    textarea{ height: 80px; resize:none;}

    input[type="date"] {
        padding: 10px 14px;
        font-size: 16px;
        min-width: 0;
        -webkit-appearance: none;
    }

    /* 送信ボタン */
    .btn{
      width:100%; border:none; border-radius: 20px;
      padding: 16px;
      background: var(--btnColor);
      color:var(--btnText);
      font-weight:900; font-size: 20px;
      box-shadow: var(--shadowPop);
      cursor:pointer; position:relative;
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:active{ transform: scale(0.98); }
    .btn:disabled {
        opacity: 0.7; transform: scale(0.98); cursor: default;
    }
    
    .hint{ font-size: 12px; color:var(--muted); line-height:1.4; padding: 4px;}

    /* トースト */
    .toastWrap{
      position:fixed; inset:0; pointer-events:none;
      display:flex; align-items:center; justify-content:center; z-index:999;
    }
    .toast{
      pointer-events:none; background: rgba(255,255,255,.95);
      border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,.2);
      padding: 20px; display:flex; gap: 16px; align-items:center;
      opacity:0; transform: translateY(20px); transition: .3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .toast.show{ opacity:1; transform: translateY(0); }
    .toast img{ width: 80px; height: 80px; object-fit:contain; }
    .toast .t1{ font-weight:900; font-size: 20px; margin:0; }
  </style>
</head>

<body>
  <div class="page">
    <div class="header-row">
      <div>
        <div class="title">名和家の家計簿！</div>
        <div class="subtitle">今日も一日お疲れ様！</div>
      </div>
      <div class="refresh-btn" id="refreshBtn" title="データを再読み込み">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </div>
    </div>

    <div class="card">
      <form id="f">
        <div>
          <label>金額（必須）</label>
          <input name="amount" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="¥ 0" required style="font-size:24px; font-weight:bold; color:#ec4899;">
        </div>

        <div>
          <label>カテゴリ（必須）</label>
          <select id="category" name="category" required>
            <option value="">(読み込み中...)</option>
          </select>
        </div>

        <div>
          <label>支払方法（必須）</label>
          <select id="method" name="method" required>
            <option value="">(読み込み中...)</option>
          </select>
        </div>

        <div>
          <label>メモ（任意）</label>
          <textarea name="memo" placeholder="何に使った？"></textarea>
        </div>

        <div>
          <label>日付（空欄なら今日）</label>
          <input id="dateInput" name="date" type="date" />
        </div>

        <button class="btn" type="submit" id="submitBtn">
            <span>記録する</span>
        </button>

        <div class="hint">
          ※カテゴリ・支払方法が出ない場合は右上の更新ボタンを押してね
        </div>
      </form>
    </div>
  </div>

  <div class="toastWrap">
    <div class="toast" id="toast">
      <img id="kuromiImg" alt="Success">
      <div>
        <div class="t1">登録しました！</div>
        <div style="font-size:14px; color:#666;">（協力ありがとう♪）</div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 設定エリア
    // ==========================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycby31bFD85uYThxMWBEOptm7OU1ucc4EmZssDbO2Kbm_nUNemLpDgS_dhEZ-7cyCNDzN/exec";
    
    // 画像設定（フォルダ内の画像を優先）
    const POM_OVERRIDE_URL = "icons/Gemini_Generated_Image_va05a4va05a4va05_transparent.png";
    const CACHE_KEY = "nawa_kakeibo_master_v1";

    // ==========================================
    // 1. 高速化ロジック (Cache First)
    // ==========================================
    async function loadMasterData(forceReload = false) {
        const catSelect = document.getElementById("category");
        const metSelect = document.getElementById("method");

        const cached = localStorage.getItem(CACHE_KEY);
        if (!forceReload && cached) {
            applyMasterData(JSON.parse(cached));
            return;
        }

        try {
            if(forceReload) {
                catSelect.innerHTML = "<option>読み込み中...</option>";
                metSelect.innerHTML = "<option>読み込み中...</option>";
            }
            const data = await jsonp(GAS_URL + "?action=master");
            localStorage.setItem(CACHE_KEY, JSON.stringify(data));
            applyMasterData(data);
            if(forceReload) alert("最新データを読み込みました！");
        } catch(e) {
            if(!cached) alert("読み込みエラー: " + e.message);
        }
    }

    function applyMasterData(data) {
        const setOpts = (sel, items) => {
            sel.innerHTML = "";
            const op0 = document.createElement("option");
            op0.value = ""; op0.textContent = "選択してください";
            sel.appendChild(op0);
            items.forEach(v => {
                const op = document.createElement("option");
                op.value = v; op.textContent = v;
                sel.appendChild(op);
            });
        };
        setOpts(document.getElementById("category"), data.categories || []);
        setOpts(document.getElementById("method"), data.methods || []);

        const pomUrl = (POM_OVERRIDE_URL && POM_OVERRIDE_URL.trim()) ? POM_OVERRIDE_URL : (data.pomUrls && data.pomUrls[0]);
        if (pomUrl) {
            document.body.classList.add("hasPom");
            document.body.style.setProperty("--pomBg", `url("${pomUrl}")`);
        }
        if (data.kuromiUrls && data.kuromiUrls.length) {
            document.getElementById("kuromiImg").src = data.kuromiUrls[0];
        }
    }

    window.addEventListener("DOMContentLoaded", () => {
        loadMasterData();
        document.getElementById("refreshBtn").onclick = () => loadMasterData(true);
    });

    // ==========================================
    // 2. 爆速送信 (Optimistic UI + Keepalive)
    // ==========================================
    document.getElementById("f").addEventListener("submit", (ev) => {
        ev.preventDefault();
        const btn = document.getElementById("submitBtn");
        const fd = new FormData(ev.target);

        // --- ① UIを即座に成功状態にする（楽観的UI） ---
        showToast();   // 「完了」表示
        ev.target.reset(); // フォームをリセット
        document.activeElement.blur(); // キーボードを閉じる
        
        // 連打防止のため一瞬だけ無効化（0.5秒で復活）
        btn.disabled = true;
        setTimeout(() => btn.disabled = false, 500);

        // --- ② データ整形 ---
        let dateVal = fd.get("date");
        if (!dateVal) {
            const now = new Date();
            const y = now.getFullYear();
            const m = ("0" + (now.getMonth()+1)).slice(-2);
            const d = ("0" + now.getDate()).slice(-2);
            dateVal = `${y}-${m}-${d}`;
        }
        fd.set("date", dateVal);

        const a = (fd.get("amount") || "").toString().replace(/[^\d]/g, "");
        fd.set("amount", a);

        // --- ③ 裏で送信 (Fire and Forget) ---
        // keepalive: true により、ブラウザを閉じても送信が継続される
        fetch(GAS_URL, { 
            method: "POST", 
            body: fd, 
            keepalive: true 
        }).then(res => res.json())
          .then(js => {
              if (!js.ok) {
                  // 万が一失敗した場合は遅れてアラート（稀なケース）
                  alert("【注意】送信に失敗した可能性があります。\n" + (js.error || ""));
              }
          })
          .catch(e => {
              alert("【通信エラー】送信できませんでした。\nネット環境を確認してください。");
          });
    });

    function showToast(){
        const t = document.getElementById("toast");
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2500);
    }

    function jsonp(url) {
        return new Promise((resolve, reject) => {
            const cb = "cb_" + Math.random().toString(36).slice(2);
            window[cb] = (data) => { resolve(data); cleanup(); };
            const s = document.createElement("script");
            s.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cb;
            s.onerror = () => { reject(new Error("Network Error")); cleanup(); };
            document.head.appendChild(s);
            function cleanup(){ try{delete window[cb];}catch(e){} s.remove(); }
        });
    }
  </script>
</body>
</html>
