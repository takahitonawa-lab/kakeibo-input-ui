<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>名和家の家計簿！</title>
  <style>
    :root{
      /* 鮮やかなキャンディグラデーション */
      --ink: #333;
      --muted: #777;
      --bg-pink: #ff85b3;
      --bg-purple: #a18cd1;
      --accent-pink: #ff5e95;
      --card-bg: rgba(255, 255, 255, 0.9);
      --border-thick: 3px;
    }

    /* フォントをシステムデフォルトに回帰 */
    html,body{
      margin:0; padding:0;
      background: linear-gradient(135deg, var(--bg-pink) 0%, var(--bg-purple) 100%);
      background-attachment: fixed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100%; overflow: hidden; color: var(--ink);
    }
    *{ box-sizing: border-box; touch-action: manipulation; }

    .page { max-width: 500px; margin: 0 auto; padding: 12px; height: 100svh; overflow-y: auto; position: relative; z-index: 1; }
    
    /* ① 右上画像：デカく、透過、背面 */
    .header { position: relative; margin-bottom: 8px; min-height: 100px; padding-top: 10px; }
    .title-group { position: relative; z-index: 2; }
    .title-main { font-size: 26px; font-weight: 900; margin: 0; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
    .title-sub { font-size: 14px; color: #fff; margin: 4px 0 0 0; font-weight: 600; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
    
    .top-icon {
      position: absolute; right: -20px; top: -10px;
      width: 130px; height: 130px; object-fit: contain;
      opacity: 0.35; /* 透過 */
      z-index: 0; /* 背面 */
      pointer-events: none;
    }

    /* カードデザイン（角丸を強く、白枠を太く） */
    .budget-card {
      position: relative; z-index: 2;
      background: var(--card-bg); border-radius: 20px; padding: 16px;
      margin-bottom: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      border: var(--border-thick) solid #fff;
    }
    .budget-info { display: flex; justify-content: space-between; font-size: 15px; font-weight: bold; }
    .budget-bar-bg { height: 14px; background: #eee; border-radius: 7px; overflow: hidden; margin-top: 8px; border: 1px solid #fff; }
    .budget-bar-fill { height: 100%; background: linear-gradient(90deg, #34d399, #10b981); width: 0%; transition: width 1s ease; }

    .card {
      background: var(--card-bg); border-radius: 24px; padding: 20px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.1);
      border: var(--border-thick) solid #fff;
      backdrop-filter: blur(8px);
    }
    label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 5px; font-weight: bold; padding-left: 5px; }
    
    .amount-wrapper { position: relative; display: flex; align-items: center; margin-bottom: 15px; }
    .currency { position: absolute; left: 16px; font-weight: 900; font-size: 24px; color: var(--accent-pink); }
    input[name="amount"] {
      padding-left: 45px !important; font-size: 30px !important; font-weight: 900;
      color: var(--accent-pink); border: var(--border-thick) solid #ffcbdc !important;
      background: #fff !important; border-radius: 16px;
    }

    input, select {
      width: 100%; border: 2px solid #eee; border-radius: 14px;
      padding: 0 12px; height: 48px; font-size: 16px; outline: none;
      margin-bottom: 15px; background: #fff;
    }

    /* ③ 日付をコンパクトに、④スタンプボタンを正方形で画像拡大 */
    .row-flex { display: flex; gap: 15px; align-items: flex-end; margin-top: 5px; }
    .date-box { flex: 1; min-width: 0; } /* 日付欄を柔軟に縮小 */
    .date-box input { margin-bottom: 0; font-size: 15px; }

    .btn-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .stamp-btn {
      width: 72px; height: 72px; border-radius: 18px; /* 正方形 */
      border: var(--border-thick) solid #fff; 
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      box-shadow: 0 6px 0px rgba(255, 94, 149, 0.3);
      cursor: pointer; position: relative;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.1s; padding: 0; overflow: hidden;
    }
    /* ボタン画像を拡大表示 */
    .stamp-btn img { width: 90%; height: 90%; object-ratio: contain; }
    .btn-label { font-size: 11px; font-weight: 900; color: #ff5e95; }
    
    .stamp-btn:active { transform: translateY(4px); box-shadow: 0 2px 0px rgba(255, 94, 149, 0.3); }
    .stamp-btn:disabled { filter: grayscale(1); }

    /* 履歴リスト */
    .history-item {
      background: rgba(255, 255, 255, 0.8); border-radius: 18px;
      padding: 12px 16px; display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 10px; border: 2px solid #fff;
    }
    .h-memo { font-weight: bold; font-size: 15px; }
    .h-sub { font-size: 11px; color: var(--muted); }
    .del-btn { color: #fff; border: none; background: #ff5e95; border-radius: 10px; width: 34px; height: 34px; font-weight: bold; }

    /* トースト通知 */
    .toastWrap { position: fixed; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; z-index: 999; }
    .toast { background: #fff; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); padding: 25px; display: flex; gap: 20px; align-items: center; opacity: 0; transform: translateY(30px); transition: .4s; border: 4px solid var(--accent-pink); }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast img { width: 75px; height: 75px; object-fit: contain; }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div class="title-group">
        <h1 class="title-main">名和家の家計簿！</h1>
        <p class="title-sub" id="randomMsg">読み込み中...</p>
      </div>
      <img src="icon_trans.png" class="top-icon" onerror="this.style.display='none'">
    </div>

    <div class="budget-card">
      <div class="budget-info">
        <span style="color:var(--accent-pink);">今月の実績/予算</span>
        <span>¥<span id="cur">0</span> / <span id="lim">0</span></span>
      </div>
      <div class="budget-bar-bg"><div class="budget-bar-fill" id="bar"></div></div>
    </div>

    <div class="card">
      <form id="f">
        <label>金額</label>
        <div class="amount-wrapper">
          <span class="currency">¥</span>
          <input name="amount" type="tel" inputmode="numeric" placeholder="0" required>
        </div>

        <div style="display:flex; gap:10px; margin-bottom:15px;">
          <div style="flex:1.2;">
            <label>カテゴリ</label>
            <select id="category" name="category" required style="margin-bottom:0;"></select>
          </div>
          <div style="flex:1;">
            <label>支払方法</label>
            <select id="method" name="method" required style="margin-bottom:0;"></select>
          </div>
        </div>

        <label>店名・メモ（任意）</label>
        <input name="memo" placeholder="例：アオキ、ツルハ、鬼がらし">

        <div class="row-flex">
          <div class="date-box">
            <label>日付</label>
            <input name="date" type="date">
          </div>
          
          <div class="btn-group">
            <button class="stamp-btn" type="submit" id="subBtn">
              <img src="stamp.png" onerror="this.src='https://img.icons8.com/bubbles/100/000000/todo-list.png'">
            </button>
            <span class="btn-label">記録！</span>
          </div>
        </div>
      </form>
    </div>

    <div style="margin-top:24px; padding-bottom: 40px;">
      <div style="font-size:14px; font-weight:bold; color:#fff; margin-bottom:12px; padding-left:10px; text-shadow: 1px 1px 2px rgba(0,0,0,0.1);">最近の記録</div>
      <div id="hList"></div>
    </div>
  </div>

  <div class="toastWrap">
    <div class="toast" id="tst">
      <img src="kuromi.png" onerror="this.src='https://img.icons8.com/bubbles/100/000000/heart-with-pulse.png'">
      <div>
        <div style="font-weight:900; font-size:22px; color:var(--accent-pink);">登録完了！</div>
        <div style="font-size:13px; color:var(--muted); font-weight:bold;">家計簿を更新したよ♪</div>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycby31bFD85uYThxMWBEOptm7OU1ucc4EmZssDbO2Kbm_nUNemLpDgS_dhEZ-7cyCNDzN/exec";

    const messages = [
        "登録作業、いつもありがとう！",
        "体調は大丈夫？しっかり寝てね",
        "今日も一日、お疲れ様！",
        "無理しないで、ゆっくり休んでね",
        "いつも家計を支えてくれて感謝！",
        "美味しいもの食べてリラックス♪",
        "少しずつ、理想の家計へ！",
        "明日も素敵な一日になりますように",
        "あなたの頑張り、見てるよ",
        "今日も100点！自分を褒めてね"
    ];

    async function load() {
      const msgEl = document.getElementById("randomMsg");
      msgEl.textContent = messages[Math.floor(Math.random() * messages.length)];

      const d = await jsonp(GAS_URL + "?action=master");
      document.getElementById("cur").textContent = Math.floor(d.budget.total).toLocaleString();
      document.getElementById("lim").textContent = Math.floor(d.budget.limit).toLocaleString();
      document.getElementById("bar").style.width = d.budget.percent + "%";
      
      const f = (i, l) => { document.getElementById(i).innerHTML = l.map(v => `<option value="${v}">${v}</option>`).join(''); };
      f("category", d.categories); f("method", d.methods);
      
      document.getElementById("hList").innerHTML = d.history.map(h => `
        <div class="history-item">
          <div>
            <div class="h-memo">${h.memo || h.category}</div>
            <div class="h-sub">${h.date} · ${h.category}</div>
          </div>
          <div style="display:flex; align-items:center; gap:12px;">
            <span style="font-weight:900; font-size:18px; color:var(--accent-pink);">¥${h.amount.toLocaleString()}</span>
            <button class="del-btn" onclick="del('${h.id}')">×</button>
          </div>
        </div>`).join('');
    }

    window.del = async (id) => { if(!confirm("この記録を消してもいい？")) return; await fetch(GAS_URL + "&action=delete&rowId=" + id, { method: "POST" }); load(); };

    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault(); 
      const b = document.getElementById("subBtn"); 
      b.disabled = true;
      const fd = new FormData(e.target); 
      fd.set("amount", fd.get("amount").replace(/[^0-9]/g, ""));
      
      const tst = document.getElementById("tst");
      tst.classList.add("show");
      
      await fetch(GAS_URL, { method: "POST", body: fd, keepalive: true });
      
      setTimeout(() => { tst.classList.remove("show"); }, 2500);
      e.target.reset(); 
      load(); 
      b.disabled = false;
    });

    function jsonp(u) { return new Promise(r => { const c = "cb" + Date.now(); window[c] = d => { r(d); delete window[c]; s.remove(); }; const s = document.createElement("script"); s.src = `${u}&callback=${c}`; document.head.appendChild(s); }); }
    load();
  </script>
</body>
</html>
